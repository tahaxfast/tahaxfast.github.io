<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#13151d"/>
<title>AlphaBot | هوش مصنوعی فارسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>"/>

<style>
:root{
  --bg:#13151d;
  --bg-2:#1a1d27;
  --bg-3:#222533;
  --bg-4:#2a2e3d;
  --bg-chat:#0f1119;
  --primary:#D4FE00;
  --primary-soft:rgba(212,254,0,.1);
  --primary-glow:rgba(212,254,0,.4);
  --accent:#00d9ff;
  --text:#ffffff;
  --text-2:#a1a1b5;
  --text-3:#6b6b80;
  --success:#22c55e;
  --danger:#ef4444;
  --border:#2a2d3a;
  --border-primary:rgba(212,254,0,.3);
  --grad:linear-gradient(135deg,#D4FE00,#b8dd00);
  --grad-cool:linear-gradient(135deg,#D4FE00,#00d9ff);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --r:12px;
  --r-lg:16px;
  --r-xl:24px;
  --ease:cubic-bezier(.4,0,.2,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.7;font-size:15px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}
::selection{background:var(--primary);color:var(--bg)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes cursor{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}

.screen{display:none;width:100%;height:100vh;position:relative}
.screen.active{display:flex;animation:fadeIn .2s}

/* AUTH */
.auth-screen{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100vh;background:var(--bg);
  padding:20px;position:relative;overflow:hidden;
}
.auth-screen::before{
  content:'';position:absolute;top:-50%;left:-20%;
  width:800px;height:800px;
  background:radial-gradient(circle,rgba(212,254,0,.08),transparent 70%);
  border-radius:50%;animation:float 10s infinite;
}
.auth-screen::after{
  content:'';position:absolute;bottom:-50%;right:-20%;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(77,107,254,.08),transparent 70%);
  border-radius:50%;animation:float 12s infinite reverse;
}
.auth-container{width:100%;max-width:420px;position:relative;z-index:1;animation:scaleIn .4s}
.auth-logo{text-align:center;margin-bottom:36px}
.auth-logo-icon{
  width:80px;height:80px;margin:0 auto 20px;
  border-radius:22px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;box-shadow:0 0 60px var(--primary-glow);
  position:relative;
}
.auth-logo-icon::after{
  content:'';position:absolute;inset:-4px;
  border:2px solid var(--primary);border-radius:26px;
  animation:pulse 2s infinite;
}
.auth-title{
  font-family:'Orbitron',sans-serif;
  font-size:1.9rem;font-weight:900;
  letter-spacing:2px;margin-bottom:8px;
}
.auth-title span{
  background:var(--grad-cool);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% 200%;animation:shimmer 3s infinite;
}
.auth-subtitle{font-size:.88rem;color:var(--text-3)}

.auth-tabs{
  display:flex;gap:4px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r);
  padding:4px;margin-bottom:24px;
}
.auth-tab{
  flex:1;padding:10px;border:none;background:transparent;
  color:var(--text-2);font-family:inherit;
  font-size:.88rem;font-weight:700;cursor:pointer;
  border-radius:8px;transition:.3s;
}
.auth-tab.active{background:var(--grad);color:var(--bg)}

.auth-field{margin-bottom:14px}
.auth-field label{
  display:block;font-size:.82rem;color:var(--text-2);
  font-weight:700;margin-bottom:8px;
}
.auth-input{
  width:100%;padding:13px 16px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:inherit;font-size:.92rem;
  outline:none;transition:.3s;
}
.auth-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);
}
.auth-input::placeholder{color:var(--text-3)}

.auth-msg{
  padding:12px 16px;border-radius:var(--r);
  font-size:.85rem;font-weight:600;
  margin-bottom:16px;display:none;
}
.auth-msg.error{
  display:block;background:rgba(239,68,68,.1);
  color:var(--danger);border:1px solid rgba(239,68,68,.3);
}
.auth-msg.success{
  display:block;background:rgba(34,197,94,.1);
  color:var(--success);border:1px solid rgba(34,197,94,.3);
}

.auth-btn{
  width:100%;padding:14px;border:none;border-radius:var(--r);
  font-family:inherit;font-size:.95rem;font-weight:800;
  cursor:pointer;transition:.4s var(--bounce);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.auth-btn.primary{
  background:var(--grad);color:var(--bg);
  box-shadow:0 4px 20px var(--primary-glow);
}
.auth-btn.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px var(--primary-glow);
}
.auth-btn.secondary{
  background:var(--bg-2);color:var(--text);
  border:1px solid var(--border);
}
.auth-btn.secondary:hover{
  background:var(--bg-3);border-color:var(--border-primary);
}

.auth-divider{
  display:flex;align-items:center;gap:12px;
  margin:20px 0;color:var(--text-3);font-size:.78rem;
}
.auth-divider::before,.auth-divider::after{
  content:'';flex:1;height:1px;background:var(--border);
}

/* CHAT */
.chat-app{display:flex;width:100%;height:100vh;background:var(--bg)}

.sidebar{
  width:260px;background:var(--bg-2);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .25s var(--ease);
  flex-shrink:0;position:relative;z-index:100;
}
.sidebar-header{
  padding:14px 16px;display:flex;
  align-items:center;justify-content:space-between;
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;padding:6px 8px;
  border-radius:8px;transition:.2s;flex:1;
}
.sidebar-logo:hover{background:var(--bg-3)}
.sidebar-logo-icon{
  width:34px;height:34px;border-radius:10px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;color:var(--bg);flex-shrink:0;
  box-shadow:0 0 20px var(--primary-glow);
}
.sidebar-logo-text{
  font-family:'Orbitron',sans-serif;
  font-size:1rem;font-weight:900;letter-spacing:1px;
}
.sidebar-logo-text .alpha{
  background:var(--grad-cool);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.sidebar-logo-text .bot{color:#fff}

.new-chat-btn{
  margin:8px 12px 14px;padding:12px 14px;
  background:var(--grad);border:none;border-radius:10px;
  color:var(--bg);font-family:inherit;
  font-size:.88rem;font-weight:800;
  cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:.3s var(--bounce);
  box-shadow:0 4px 16px var(--primary-glow);
}
.new-chat-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px var(--primary-glow);
}

.chat-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.chat-list-label{
  font-size:.68rem;color:var(--text-3);
  font-weight:700;letter-spacing:1px;
  padding:12px 12px 6px;text-transform:uppercase;
}
.chat-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;
  cursor:pointer;transition:.2s;
  color:var(--text-2);font-size:.88rem;
  position:relative;margin-bottom:2px;
}
.chat-item:hover{background:var(--bg-3);color:var(--text)}
.chat-item.active{
  background:var(--primary-soft);color:var(--text);
  border:1px solid var(--border-primary);
}
.chat-item i{
  font-size:.85rem;color:var(--text-3);
  flex-shrink:0;transition:.2s;
}
.chat-item.active i,.chat-item:hover i{color:var(--primary)}
.chat-item-text{
  flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.chat-item .del-btn{
  opacity:0;background:transparent;border:none;
  color:var(--text-3);cursor:pointer;
  padding:4px;border-radius:6px;
  transition:.2s;font-size:.75rem;
}
.chat-item:hover .del-btn{opacity:1}
.chat-item .del-btn:hover{
  color:var(--danger);background:rgba(239,68,68,.15);
}

.sidebar-footer{
  padding:10px 12px;border-top:1px solid var(--border);
}
.user-btn{
  width:100%;padding:8px 10px;
  background:transparent;border:none;border-radius:10px;
  display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:.2s;
  font-family:inherit;color:var(--text);text-align:right;
}
.user-btn:hover{background:var(--bg-3)}
.user-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:.88rem;font-weight:800;
  color:var(--bg);flex-shrink:0;
}
.user-info{flex:1;min-width:0;text-align:right}
.user-name{
  font-size:.85rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-plan{
  font-size:.7rem;color:var(--text-3);
  display:flex;align-items:center;gap:4px;
}
.user-plan .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--success);
  box-shadow:0 0 8px var(--success);
  animation:pulse 2s infinite;
}

.chat-main{
  flex:1;display:flex;flex-direction:column;
  background:var(--bg);min-width:0;position:relative;
}

.chat-header{
  padding:12px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;background:rgba(19,21,29,.9);
  backdrop-filter:blur(10px);z-index:10;
}
.chat-header-left{
  display:flex;align-items:center;gap:12px;
  min-width:0;flex:1;
}
.menu-btn{
  display:none;width:38px;height:38px;
  border-radius:10px;background:transparent;
  border:none;color:var(--text-2);
  cursor:pointer;align-items:center;justify-content:center;
  transition:.2s;font-size:1rem;
}
.menu-btn:hover{background:var(--bg-2);color:var(--text)}
.header-title{display:flex;align-items:center;gap:10px}
.header-title-icon{
  width:34px;height:34px;border-radius:10px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:var(--bg);
  box-shadow:0 0 20px var(--primary-glow);
  animation:pulse 3s infinite;
}
.header-title-text{
  font-family:'Orbitron',sans-serif;
  font-size:.95rem;font-weight:900;letter-spacing:1px;
}
.header-title-text .alpha{
  background:var(--grad-cool);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header-title-text .bot{color:#fff}
.header-title-status{
  font-size:.7rem;color:var(--success);
  display:flex;align-items:center;gap:4px;font-weight:600;
}
.header-title-status::before{
  content:'';width:6px;height:6px;
  background:var(--success);border-radius:50%;
  box-shadow:0 0 8px var(--success);
  animation:pulse 2s infinite;
}
.header-actions{display:flex;gap:6px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  background:transparent;border:1px solid var(--border);
  color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;font-size:.95rem;
}
.icon-btn:hover{
  background:var(--bg-2);
  border-color:var(--border-primary);color:var(--primary);
}

.messages{
  flex:1;overflow-y:auto;
  padding:24px 20px 20px;scroll-behavior:smooth;
}
.messages-inner{max-width:780px;margin:0 auto}

.welcome{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;min-height:calc(100vh - 240px);
  padding:20px;animation:fadeIn .4s;
}
.welcome-icon{
  width:80px;height:80px;border-radius:22px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;color:var(--bg);
  margin-bottom:24px;
  box-shadow:0 0 60px var(--primary-glow);
  animation:float 4s infinite;
}
.welcome h1{
  font-size:1.8rem;font-weight:800;
  margin-bottom:12px;letter-spacing:-.5px;
}
.welcome h1 span{
  background:var(--grad-cool);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% 200%;animation:shimmer 3s infinite;
}
.welcome p{
  font-size:.95rem;color:var(--text-3);
  margin-bottom:32px;max-width:500px;line-height:1.9;
}
.suggestions{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;max-width:600px;width:100%;
}
.suggestion{
  padding:14px 16px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r);
  cursor:pointer;transition:.4s var(--bounce);
  text-align:right;font-size:.85rem;color:var(--text-2);
  display:flex;align-items:center;gap:10px;
}
.suggestion:hover{
  background:var(--primary-soft);
  border-color:var(--border-primary);
  color:var(--text);transform:translateY(-4px);
  box-shadow:0 8px 24px var(--primary-glow);
}
.suggestion i{font-size:.9rem;color:var(--primary);flex-shrink:0}

.msg{
  margin-bottom:24px;animation:fadeUp .25s;
  display:flex;gap:14px;
}
.msg.user{flex-direction:row-reverse}
.msg-avatar{
  width:36px;height:36px;border-radius:10px;
  flex-shrink:0;display:flex;
  align-items:center;justify-content:center;
  font-size:.9rem;font-weight:800;
}
.msg.user .msg-avatar{
  background:linear-gradient(135deg,#4d6bfe,#8b5cf6);
  color:#fff;
}
.msg.ai .msg-avatar{
  background:var(--grad);color:var(--bg);
  box-shadow:0 0 16px var(--primary-glow);
}
.msg-body{flex:1;min-width:0;max-width:100%}
.msg.user .msg-body{
  display:flex;flex-direction:column;align-items:flex-end;
}
.msg-content{
  font-size:.95rem;line-height:1.9;color:var(--text);
  word-wrap:break-word;overflow-wrap:break-word;
  white-space:pre-wrap;
}
.msg.user .msg-content{
  background:var(--grad);color:var(--bg);
  padding:12px 18px;border-radius:var(--r-lg);
  border-bottom-left-radius:6px;
  max-width:85%;display:inline-block;font-weight:500;
}
.msg.ai .msg-content{padding:4px 0;max-width:100%}
.msg-content pre{
  background:var(--bg-2);border:1px solid var(--border);
  padding:14px;border-radius:10px;
  margin:10px 0;overflow-x:auto;
  direction:ltr;text-align:left;
  font-family:'Consolas','Monaco',monospace;
  font-size:.85rem;line-height:1.6;position:relative;
}
.msg-content pre::before{
  content:'code';position:absolute;
  top:6px;left:10px;font-size:.65rem;
  color:var(--text-3);text-transform:uppercase;letter-spacing:1px;
}
.msg-content code{
  background:var(--bg-2);border:1px solid var(--border);
  padding:2px 6px;border-radius:4px;
  font-family:'Consolas','Monaco',monospace;
  font-size:.85rem;direction:ltr;
  display:inline-block;color:var(--primary);
}
.msg-content strong{color:var(--primary);font-weight:700}
.msg-content em{color:var(--accent);font-style:italic}

.msg-actions{
  display:flex;gap:4px;margin-top:8px;
  opacity:0;transition:.2s;
}
.msg:hover .msg-actions{opacity:1}
.msg.user .msg-actions{justify-content:flex-end}
.action-btn{
  width:30px;height:30px;border-radius:8px;
  background:transparent;border:1px solid var(--border);
  color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;font-size:.78rem;
}
.action-btn:hover{
  background:var(--bg-2);
  border-color:var(--border-primary);color:var(--primary);
}

.typing{
  display:flex;align-items:center;gap:8px;
  padding:12px 0;color:var(--text-3);font-size:.85rem;
}
.typing-dots{display:flex;gap:4px}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;
  background:var(--primary);
  animation:dot 1.4s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}

.stream-cursor{
  display:inline-block;width:2px;
  height:1.1em;background:var(--primary);
  margin-right:2px;vertical-align:middle;
  animation:cursor .8s infinite;
  box-shadow:0 0 8px var(--primary);
}

.input-area{
  padding:16px 20px 20px;
  background:rgba(19,21,29,.95);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
}
.input-wrapper{max-width:780px;margin:0 auto}
.input-box{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:10px 12px 10px 16px;transition:.3s;
}
.input-box:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);
}
.chat-input{
  flex:1;background:transparent;border:none;
  color:var(--text);font-family:inherit;
  font-size:.95rem;outline:none;
  resize:none;max-height:200px;
  min-height:26px;padding:6px 0;line-height:1.6;
}
.chat-input::placeholder{color:var(--text-3)}

.input-btn{
  width:38px;height:38px;border-radius:10px;
  background:transparent;border:none;
  color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.3s;font-size:.95rem;flex-shrink:0;
}
.input-btn:hover{background:var(--bg-3);color:var(--primary)}
.input-btn.send{
  background:var(--grad);color:var(--bg);
  box-shadow:0 4px 16px var(--primary-glow);
}
.input-btn.send:hover{
  transform:scale(1.05);
  box-shadow:0 6px 20px var(--primary-glow);
}
.input-btn.send:disabled{
  background:var(--bg-3);color:var(--text-3);
  cursor:not-allowed;box-shadow:none;transform:none;
}

.input-footer{
  max-width:780px;margin:10px auto 0;
  font-size:.72rem;color:var(--text-3);text-align:center;
}

.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(4px);z-index:9999;
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.active{display:flex;animation:fadeIn .15s}
.modal{
  background:var(--bg-2);
  border:1px solid var(--border-primary);
  border-radius:var(--r-xl);padding:26px;
  max-width:400px;width:100%;
  animation:scaleIn .25s;
  box-shadow:var(--shadow-lg),0 0 60px var(--primary-glow);
}
.modal h3{
  font-size:1.1rem;font-weight:800;
  margin-bottom:16px;display:flex;
  align-items:center;gap:10px;
}
.modal h3 i{color:var(--primary)}
.modal-info{
  padding:12px;background:var(--bg-3);
  border-radius:10px;margin-bottom:10px;
}
.modal-info .label{
  font-size:.72rem;color:var(--text-3);margin-bottom:4px;
}
.modal-info .value{
  font-weight:700;font-size:.9rem;
  direction:ltr;text-align:right;
}
.modal-actions{
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:20px;flex-wrap:wrap;
}
.modal-actions button{

<script>
// ============================================================
// ⚙️ API CONFIG - GapGPT
// ============================================================
const API_CONFIG = {
  url: 'https://api.gapgpt.app/v1/chat/completions',
  key: 'sk-04z3Brfq5K1ce4OBJ7QipeHAR9gdupCUWsBzMPn0FuN2HHyH',
  model: 'gpt-4o-mini'
};

// ============================================================
// Storage
// ============================================================
const OWNER_EMAIL = 'tahadaneshbayan2@gmail.com';
const SK = 'alphabot_session';
const UK = 'alphabot_users';
const CK = 'alphabot_chats';
const MK = 'alphabot_messages';

let currentUser = null;
let currentChatId = null;
let chats = [];
let messages = [];
let isStreaming = false;
let currentAbortController = null;

function gs(k, d=[]){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function ss(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}

function loadAll(){
  chats = gs(CK, []);
  messages = gs(MK, []);
  const users = gs(UK, []);
  let updated = false;
  users.forEach(u=>{
    if(u.email.toLowerCase() === OWNER_EMAIL.toLowerCase() && (!u.is_admin || u.role !== 'owner')){
      u.is_admin = true; u.role = 'owner'; updated = true;
    }
  });
  if(updated) ss(UK, users);
  const s = gs(SK, null);
  if(s){
    if(s.email && s.email.toLowerCase() === OWNER_EMAIL.toLowerCase()){
      s.is_admin = true; s.role = 'owner'; ss(SK, s);
    }
    currentUser = s;
  }
}

function toast(m, type=''){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = m;
  document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(), 300)}, 3000);
}
function authMsg(m, t='error'){
  const b = document.getElementById('authMsg');
  b.textContent = m;
  b.className = 'auth-msg ' + t;
  b.style.display = 'block';
  setTimeout(()=>b.style.display='none', 5000);
}
function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}
function scrollToBottom(smooth=false){
  const c = document.getElementById('chatMessages');
  if(c) c.scrollTo({top: c.scrollHeight, behavior: smooth?'smooth':'auto'});
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const s = document.getElementById('screen-'+name);
  if(s) s.classList.add('active');
}

// AUTH
document.querySelectorAll('.auth-tab').forEach(tab=>{
  tab.addEventListener('click', function(){
    const t = this.dataset.tab;
    document.querySelectorAll('.auth-tab').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('loginForm').style.display = t==='login'?'block':'none';
    document.getElementById('regForm').style.display = t==='register'?'block':'none';
    document.getElementById('authMsg').style.display = 'none';
  });
});

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const em = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pw = document.getElementById('loginPass').value;
  if(!em || !pw){authMsg('ایمیل و رمز رو پر کن'); return}
  
  let u = gs(UK, []);
  
  if(em === OWNER_EMAIL.toLowerCase()){
    let o = u.find(x=>x.email.toLowerCase() === em);
    if(o){
      if(o.password !== pw){authMsg('رمز اشتباه');return}
    } else {
      o = {id:Date.now(), email:em, password:pw, full_name:'مالک AlphaBot', role:'owner', is_admin:true, created_at:new Date().toISOString()};
      u.push(o);
    }
    o.role = 'owner'; o.is_admin = true;
    ss(UK, u);
    currentUser = {user_id:o.id, email:o.email, full_name:o.full_name, role:'owner', is_admin:true};
    ss(SK, currentUser);
    authMsg('👑 خوش آمدید مالک!','success');
    setTimeout(startApp, 500);
    return;
  }
  
  const x = u.find(y=>y.email.toLowerCase() === em);
  if(!x){authMsg('کاربر پیدا نشد');return}
  if(x.password !== pw){authMsg('رمز اشتباه');return}
  
  currentUser = {user_id:x.id, email:x.email, full_name:x.full_name, role:x.role||'user', is_admin:x.is_admin||false};
  ss(SK, currentUser);
  authMsg('✅ ورود موفق','success');
  setTimeout(startApp, 500);
});

document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const n = document.getElementById('regName').value.trim();
  const em = document.getElementById('regEmail').value.trim().toLowerCase();
  const pw = document.getElementById('regPass').value;
  if(!n){authMsg('نام رو بزن');return}
  if(!em || !em.includes('@')){authMsg('ایمیل معتبر');return}
  if(pw.length < 6){authMsg('رمز حداقل ۶ کاراکتر');return}
  
  let u = gs(UK, []);
  if(u.find(x=>x.email.toLowerCase() === em)){authMsg('این ایمیل ثبت شده');return}
  
  const io = em === OWNER_EMAIL.toLowerCase();
  const nu = {id:Date.now(), email:em, password:pw, full_name:n, role:io?'owner':'user', is_admin:io, created_at:new Date().toISOString()};
  u.push(nu); ss(UK, u);
  currentUser = {user_id:nu.id, email:nu.email, full_name:nu.full_name, role:nu.role, is_admin:nu.is_admin};
  ss(SK, currentUser);
  authMsg(io?'👑 ثبت‌نام مالک!':'✅ ثبت‌نام موفق','success');
  setTimeout(startApp, 500);
});

function guestLogin(){
  currentUser = {user_id:Date.now(), email:'guest@alphabot.local', full_name:'کاربر مهمان', role:'user', is_admin:false};
  ss(SK, currentUser);
  startApp();
}

function logout(){
  if(!confirm('خارج می‌شی؟')) return;
  localStorage.removeItem(SK);
  currentUser = null;
  currentChatId = null;
  showScreen('auth');
  toast('خارج شدید');
}

function startApp(){
  showScreen('chat');
  updateUserUI();
  loadChats();
  const userChats = chats.filter(c=>c.user_id === currentUser.user_id);
  if(userChats.length === 0){
    newChat();
  } else {
    const lastChat = userChats.sort((a,b)=>b.updated_at - a.updated_at)[0];
    openChat(lastChat.id);
  }
}

function updateUserUI(){
  if(!currentUser) return;
  const initials = (currentUser.full_name || currentUser.email).charAt(0).toUpperCase();
  document.getElementById('userAvatarEl').textContent = initials;
  document.getElementById('userNameEl').textContent = currentUser.full_name || 'کاربر';
  let plan = 'آنلاین';
  if(currentUser.role === 'owner') plan = '👑 مالک';
  else if(currentUser.is_admin) plan = '⭐ ادمین';
  document.getElementById('userPlanEl').innerHTML = `<span class="dot"></span><span>${plan}</span>`;
}

function newChat(){
  const id = Date.now().toString();
  const chat = {
    id,
    user_id: currentUser.user_id,
    title: 'گفتگوی جدید',
    created_at: Date.now(),
    updated_at: Date.now()
  };
  chats.push(chat);
  ss(CK, chats);
  currentChatId = id;
  loadChats();
  renderMessages();
  closeSidebar();
  setTimeout(()=>document.getElementById('chatInput')?.focus(), 100);
}

function loadChats(){
  const list = document.getElementById('chatList');
  const userChats = chats.filter(c=>c.user_id === currentUser.user_id).sort((a,b)=>b.updated_at - a.updated_at);
  
  if(userChats.length === 0){
    list.innerHTML = '<div class="chat-list-label">گفتگوهای اخیر</div>' +
      '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:.78rem;">هنوز گفتگویی نداری</div>';
    return;
  }
  
  list.innerHTML = '<div class="chat-list-label">گفتگوهای اخیر</div>' +
    userChats.map(c=>`
      <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="openChat('${c.id}')">
        <i class="fas fa-message"></i>
        <span class="chat-item-text">${escapeHtml(c.title)}</span>
        <button class="del-btn" onclick="event.stopPropagation();deleteChat('${c.id}')">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    `).join('');
}

function openChat(id){
  currentChatId = id;
  loadChats();
  renderMessages();
  closeSidebar();
}

function deleteChat(id){
  if(!confirm('این گفتگو حذف بشه؟')) return;
  chats = chats.filter(c=>c.id !== id);
  messages = messages.filter(m=>m.chat_id !== id);
  ss(CK, chats);
  ss(MK, messages);
  if(currentChatId === id){
    const userChats = chats.filter(c=>c.user_id === currentUser.user_id);
    if(userChats.length > 0) openChat(userChats[0].id);
    else newChat();
  } else {
    loadChats();
  }
  toast('🗑️ حذف شد');
}

function clearCurrentChat(){
  if(!currentChatId) return;
  if(!confirm('پیام‌های این گفتگو پاک بشه؟')) return;
  messages = messages.filter(m=>m.chat_id !== currentChatId);
  ss(MK, messages);
  renderMessages();
  toast('🧹 پاک شد');
}

function renderMessages(){
  const inner = document.getElementById('messagesInner');
  const chatMsgs = messages.filter(m=>m.chat_id === currentChatId);
  
  if(chatMsgs.length === 0){
    inner.innerHTML = renderWelcome();
    return;
  }
  
  inner.innerHTML = chatMsgs.map(m=>renderMessage(m)).join('');
  setTimeout(()=>scrollToBottom(), 30);
}

function renderWelcome(){
  return `
    <div class="welcome">
      <div class="welcome-icon">🤖</div>
      <h1>سلام، من <span>AlphaBot</span> هستم</h1>
      <p>چطور می‌تونم امروز کمکت کنم؟ هر سوالی داری بپرس یا از موضوعات زیر انتخاب کن.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="sendSuggestion('یه برنامه روزانه سالم برام بنویس')">
          <i class="fas fa-calendar-day"></i>
          <span>یه برنامه روزانه سالم بنویس</span>
        </div>
        <div class="suggestion" onclick="sendSuggestion('یه کد پایتون برای مرتب‌سازی لیست بنویس')">
          <i class="fas fa-code"></i>
          <span>یه کد پایتون یادم بده</span>
        </div>
        <div class="suggestion" onclick="sendSuggestion('راجع به هوش مصنوعی توضیح بده')">
          <i class="fas fa-brain"></i>
          <span>راجع به هوش مصنوعی بگو</span>
        </div>
        <div class="suggestion" onclick="sendSuggestion('یه شوخی بامزه برام بگو')">
          <i class="fas fa-smile"></i>
          <span>یه شوخی بامزه بگو</span>
        </div>
      </div>
    </div>
  `;
}

function renderMessage(m){
  const isUser = m.role === 'user';
  const avatar = isUser 
    ? (currentUser.full_name || currentUser.email).charAt(0).toUpperCase()
    : '<i class="fas fa-robot"></i>';
  
  return `
    <div class="msg ${isUser?'user':'ai'}" data-id="${m.id}">
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-body">
        <div class="msg-content">${formatContent(m.content)}</div>
        ${!isUser ? `
          <div class="msg-actions">
            <button class="action-btn" onclick="copyMsg('${m.id}')" title="کپی">
              <i class="fas fa-copy"></i>
            </button>
            <button class="action-btn" onclick="regenerate()" title="دوباره">
              <i class="fas fa-redo"></i>
            </button>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function formatContent(text){
  let html = escapeHtml(text || '');
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
    return `<pre><code>${code.trim()}</code></pre>`;
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function copyMsg(id){
  const m = messages.find(x=>x.id === id);
  if(!m) return;
  navigator.clipboard.writeText(m.content).then(()=>{
    toast('✅ کپی شد', 'success');
  });
}

const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

chatInput.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
  sendBtn.disabled = !this.value.trim();
});

chatInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

function sendSuggestion(text){
  chatInput.value = text;
  chatInput.dispatchEvent(new Event('input'));
  sendMessage();
}

async function sendMessage(){
  const text = chatInput.value.trim();
  if(!text || !currentChatId || isStreaming) return;
  
  isStreaming = true;
  
  const userMsg = {
    id: Date.now() + '-u',
    chat_id: currentChatId,
    role: 'user',
    content: text,
    time: Date.now()
  };
  messages.push(userMsg);
  ss(MK, messages);
  
  const chat = chats.find(c=>c.id === currentChatId);
  if(chat){
    const userMsgs = messages.filter(m=>m.chat_id === currentChatId && m.role === 'user');
    if(userMsgs.length === 1){
      chat.title = text.slice(0, 35) + (text.length > 35 ? '...' : '');
    }
    chat.updated_at = Date.now();
    ss(CK, chats);
  }
  
  chatInput.value = '';
  chatInput.style.height = 'auto';
  sendBtn.disabled = true;
  
  const inner = document.getElementById('messagesInner');
  const welcome = inner.querySelector('.welcome');
  if(welcome) welcome.remove();
  
  inner.insertAdjacentHTML('beforeend', renderMessage(userMsg));
  scrollToBottom(true);
  
  const typingId = 'typing-' + Date.now();
  inner.insertAdjacentHTML('beforeend', `
    <div class="msg ai" id="${typingId}">
      <div class="msg-avatar"><i class="fas fa-robot"></i></div>
      <div class="msg-body">
        <div class="typing">
          <span>در حال فکر کردن</span>
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>
  `);
  scrollToBottom(true);
  
  const aiMsgId = Date.now() + '-a';
  const aiMsg = {
    id: aiMsgId,
    chat_id: currentChatId,
    role: 'ai',
    content: '',
    time: Date.now()
  };
  
  try {
    currentAbortController = new AbortController();
    
    const apiMessages = [
      {
        role: 'system',
        content: 'تو AlphaBot هستی، یه دستیار هوش مصنوعی فارسی‌زبان. فقط فارسی جواب بده. دوستانه، مفید و دقیق باش. اگه کد می‌دی توی بلوک کد بذار.'
      }
    ];
    
    const prevMsgs = messages.filter(m=>m.chat_id === currentChatId && m.id !== aiMsgId).slice(-10);
    prevMsgs.forEach(m => {
      apiMessages.push({
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.content
      });
    });
    
    const response = await fetch(API_CONFIG.url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${API_CONFIG.key}`
      },
      body: JSON.stringify({
        model: API_CONFIG.model,
        messages: apiMessages,
        temperature: 0.7,
        max_tokens: 2000,
        stream: true
      }),
      signal: currentAbortController.signal
    });
    
    if(!response.ok){
      const errText = await response.text();
      console.error('API Error:', response.status, errText);
      throw new Error(`خطای ${response.status}`);
    }
    
    document.getElementById(typingId)?.remove();
    
    inner.insertAdjacentHTML('beforeend', `
      <div class="msg ai" id="msg-${aiMsgId}">
        <div class="msg-avatar"><i class="fas fa-robot"></i></div>
        <div class="msg-body">
          <div class="msg-content" id="content-${aiMsgId}"><span class="stream-cursor"></span></div>
          <div class="msg-actions">
            <button class="action-btn" onclick="copyMsg('${aiMsgId}')" title="کپی">
              <i class="fas fa-copy"></i>
            </button>
            <button class="action-btn" onclick="regenerate()" title="دوباره">
              <i class="fas fa-redo"></i>
            </button>
          </div>
        </div>
      </div>
    `);
    scrollToBottom(true);
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      
      for(const line of lines){
        if(!line.trim() || !line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if(data === '[DONE]') continue;
        
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if(delta){
            fullText += delta;
            const contentEl = document.getElementById('content-' + aiMsgId);
            if(contentEl){
              contentEl.innerHTML = formatContent(fullText) + '<span class="stream-cursor"></span>';
              scrollToBottom();
            }
          }
        } catch(e){}
      }
    }
    
    const contentEl = document.getElementById('content-' + aiMsgId);
    if(contentEl){
      contentEl.innerHTML = formatContent(fullText);
    }
    
    if(fullText.trim()){
      aiMsg.content = fullText.trim();
      messages.push(aiMsg);
      ss(MK, messages);
    } else {
      document.getElementById('msg-' + aiMsgId)?.remove();
      toast('پاسخی دریافت نشد', 'error');
    }
    
    if(chat) chat.updated_at = Date.now();
    ss(CK, chats);
    loadChats();
    
  } catch(err){
    console.error('Stream error:', err);
    document.getElementById(typingId)?.remove();
    document.getElementById('msg-' + aiMsgId)?.remove();
    
    if(err.name === 'AbortError'){
      toast('لغو شد');
    } else {
      toast('❌ خطا: ' + err.message, 'error');
    }
  }
  
  isStreaming = false;
  chatInput.focus();
}

function regenerate(){
  if(isStreaming) return;
  const chatMsgs = messages.filter(m=>m.chat_id === currentChatId);
  const lastAi = [...chatMsgs].reverse().find(m=>m.role === 'ai');
  const lastUser = [...chatMsgs].reverse().find(m=>m.role === 'user');
  if(!lastAi || !lastUser) return;
  
  messages = messages.filter(m=>m.id !== lastAi.id);
  ss(MK, messages);
  renderMessages();
  
  chatInput.value = lastUser.content;
  sendMessage();
}

function toggleSidebar(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

function openUserMenu(){
  if(!currentUser) return;
  const userChats = chats.filter(c=>c.user_id === currentUser.user_id);
  document.getElementById('modalEmail').textContent = currentUser.email;
  document.getElementById('modalChats').textContent = userChats.length + ' گفتگو';
  document.getElementById('userModal').classList.add('active');
}
function closeUserMenu(){
  document.getElementById('userModal').classList.remove('active');
}
document.getElementById('userModal').addEventListener('click', function(e){
  if(e.target === this) closeUserMenu();
});

function init(){
  loadAll();
  if(currentUser){
    startApp();
  } else {
    showScreen('auth');
  }
}
init();
</script>
