<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>آلفا بات | دستیار هوشمند</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

<style>
:root{
  --bg:#f7f7f8; --sidebar:#ffffff; --text:#1a1a1a; --muted:#6b7280;
  --border:#e5e7eb; --accent:#10a37f; --accent2:#14b88f;
  --user-bg:#10a37f; --user-text:#fff; --ai-bg:#ffffff; --ai-text:#1a1a1a;
  --input-bg:#ffffff; --code-bg:#1e1e1e;
  --shadow:0 4px 20px rgba(0,0,0,.06);
  --glow:0 0 0 3px rgba(16,163,127,.15);
}
[data-theme="dark"]{
  --bg:#212121; --sidebar:#171717; --text:#ececec; --muted:#9ca3af;
  --border:#2f2f2f; --accent:#10a37f; --accent2:#14b88f;
  --user-bg:#10a37f; --user-text:#fff; --ai-bg:#2f2f2f; --ai-text:#ececec;
  --input-bg:#2f2f2f; --code-bg:#0d0d0d;
  --shadow:0 4px 20px rgba(0,0,0,.4);
  --glow:0 0 0 3px rgba(16,163,127,.25);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text); height:100vh;
  height:100dvh; overflow:hidden;
  transition:background .4s cubic-bezier(.4,0,.2,1), color .4s cubic-bezier(.4,0,.2,1);
}

/* پس‌زمینه متحرک */
body::before{
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(16,163,127,.08), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(20,184,143,.06), transparent 50%);
  pointer-events:none; z-index:0;
  animation:bgMove 20s ease-in-out infinite alternate;
}
@keyframes bgMove{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(20px,-20px) scale(1.1)}
}

.app{
  display:grid; grid-template-columns:280px 1fr;
  height:100vh; height:100dvh;
  transition:grid-template-columns .4s cubic-bezier(.4,0,.2,1);
  position:relative; z-index:1;
}
.app.closed{grid-template-columns:0 1fr}

/* ═══ SIDEBAR ═══ */
.sidebar{
  background:var(--sidebar);
  border-left:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  transition:.4s cubic-bezier(.4,0,.2,1);
}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.new-chat{
  width:100%; padding:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; border:none; border-radius:12px;
  font-family:inherit; font-size:14px; font-weight:600;
  cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:8px; transition:.3s;
  position:relative; overflow:hidden;
}
.new-chat::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.3),transparent);
  transform:translateX(-100%); transition:transform .6s;
}
.new-chat:hover::after{transform:translateX(100%)}
.new-chat:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,163,127,.35)}
.new-chat:active{transform:translateY(0) scale(.98)}

.history{flex:1;overflow-y:auto;padding:8px;scroll-behavior:smooth}
.history::-webkit-scrollbar{width:6px}
.history::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.history::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.h-item{
  padding:11px 12px; border-radius:10px; cursor:pointer;
  font-size:13px; margin-bottom:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  display:flex; justify-content:space-between; align-items:center; gap:6px;
  position:relative;
}
.h-item::before{
  content:''; position:absolute; right:0; top:50%;
  width:3px; height:0; background:var(--accent);
  border-radius:3px; transform:translateY(-50%);
  transition:height .3s;
}
.h-item:hover{background:rgba(128,128,128,.1);transform:translateX(-3px)}
.h-item.active{background:rgba(16,163,127,.15);color:var(--accent)}
.h-item.active::before{height:60%}
.h-item .del{
  opacity:0; background:none; border:none;
  color:var(--muted); cursor:pointer; font-size:16px;
  transition:.2s; padding:0 4px; border-radius:4px;
}
.h-item:hover .del{opacity:1}
.h-item .del:hover{color:#ef4444;background:rgba(239,68,68,.1)}

.s-foot{padding:12px;border-top:1px solid var(--border)}
.theme-btn{
  width:100%; padding:11px; background:transparent;
  border:1px solid var(--border); color:var(--text);
  border-radius:10px; font-family:inherit; font-size:13px;
  cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:8px; transition:.25s;
}
.theme-btn:hover{background:rgba(128,128,128,.1);border-color:var(--accent)}
.theme-btn:active{transform:scale(.97)}

/* ═══ MAIN ═══ */
.main{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;overflow:hidden}

.topbar{
  padding:12px 20px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(247,247,248,.8); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px); z-index:10;
  transition:background .4s;
}
[data-theme="dark"] .topbar{background:rgba(33,33,33,.8)}

.menu-btn{
  background:none; border:none; color:var(--text);
  font-size:20px; cursor:pointer; padding:6px 10px;
  border-radius:8px; transition:.25s;
}
.menu-btn:hover{background:rgba(128,128,128,.15);transform:rotate(90deg)}
.menu-btn:active{transform:rotate(90deg) scale(.9)}

.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{
  width:32px;height:32px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:9px; display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:bold; font-size:14px;
  box-shadow:0 4px 12px rgba(16,163,127,.3);
  animation:logoFloat 3s ease-in-out infinite;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-3px) rotate(3deg)}
}

.chat-box{flex:1;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain}
.chat-box::-webkit-scrollbar{width:8px}
.chat-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chat-box::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.msgs{max-width:820px;margin:0 auto;padding:24px 20px 180px}

/* ═══ WELCOME ═══ */
.welcome{text-align:center;padding:50px 20px;animation:welcomeIn .8s cubic-bezier(.4,0,.2,1)}
@keyframes welcomeIn{
  from{opacity:0;transform:translateY(30px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.w-logo{
  width:80px;height:80px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),#0d8a6b);
  border-radius:24px; margin:0 auto 24px;
  display:flex; align-items:center; justify-content:center;
  font-size:36px; color:#fff;
  box-shadow:0 15px 40px rgba(16,163,127,.4);
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{transform:scale(1) rotate(0);box-shadow:0 15px 40px rgba(16,163,127,.4)}
  50%{transform:scale(1.08) rotate(5deg);box-shadow:0 20px 55px rgba(16,163,127,.6)}
}
.welcome h1{font-size:28px;margin-bottom:12px;font-weight:700;animation:fadeUp .6s .2s both}
.welcome p{color:var(--muted);font-size:15px;margin-bottom:40px;animation:fadeUp .6s .3s both}

.suggestions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px; max-width:640px; margin:0 auto;
}
.sug{
  background:var(--sidebar); border:1px solid var(--border);
  border-radius:14px; padding:16px; text-align:right;
  cursor:pointer; transition:all .3s cubic-bezier(.4,0,.2,1);
  font-family:inherit; color:var(--text); font-size:13px;
  animation:fadeUp .6s both; position:relative; overflow:hidden;
}
.sug:nth-child(1){animation-delay:.4s}
.sug:nth-child(2){animation-delay:.5s}
.sug:nth-child(3){animation-delay:.6s}
.sug:nth-child(4){animation-delay:.7s}
.sug::before{
  content:''; position:absolute; top:0; right:0; left:0;
  height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2));
  transform:scaleX(0); transform-origin:right;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.sug:hover{
  border-color:var(--accent); transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(16,163,127,.15);
}
.sug:hover::before{transform:scaleX(1)}
.sug:active{transform:translateY(-2px) scale(.98)}
.sug .ic{font-size:24px;margin-bottom:10px;display:block;transition:transform .3s}
.sug:hover .ic{transform:scale(1.2) rotate(-8deg)}
.sug .t{font-weight:600;margin-bottom:4px}
.sug .d{color:var(--muted);font-size:12px}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* ═══ MESSAGES ═══ */
.msg{
  display:flex; gap:12px; margin-bottom:20px;
  animation:msgIn .5s cubic-bezier(.4,0,.2,1);
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(20px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.msg.user{flex-direction:row-reverse}

.avatar{
  width:36px;height:36px;border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; flex-shrink:0;
  transition:transform .3s;
}
.avatar:hover{transform:scale(1.1) rotate(5deg)}
.msg.user .avatar{
  background:linear-gradient(135deg,var(--user-bg),#0d8a6b);
  color:#fff; box-shadow:0 4px 12px rgba(16,163,127,.3);
}
.msg.ai .avatar{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; box-shadow:0 4px 12px rgba(16,163,127,.3);
  animation:aiAvatar .8s cubic-bezier(.4,0,.2,1);
}
@keyframes aiAvatar{
  0%{transform:scale(0) rotate(-180deg)}
  60%{transform:scale(1.15) rotate(10deg)}
  100%{transform:scale(1) rotate(0)}
}

.bubble{
  padding:13px 17px; border-radius:16px; line-height:1.9;
  font-size:14.5px; word-wrap:break-word; overflow-wrap:break-word;
  box-shadow:var(--shadow); max-width:100%;
  transition:box-shadow .3s;
}
.bubble:hover{box-shadow:0 8px 30px rgba(0,0,0,.1)}
[data-theme="dark"] .bubble:hover{box-shadow:0 8px 30px rgba(0,0,0,.5)}

.msg.user .bubble{
  background:linear-gradient(135deg,var(--user-bg),#0d8a6b);
  color:var(--user-text); border-top-right-radius:4px;
}
.msg.ai .bubble{
  background:var(--ai-bg); color:var(--ai-text);
  border-top-left-radius:4px; flex:1;
}

/* ═══ MARKDOWN ═══ */
.bubble p{margin-bottom:10px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{margin:14px 0 8px;font-weight:700}
.bubble h1{font-size:20px}.bubble h2{font-size:17px}.bubble h3{font-size:15px}
.bubble ul,.bubble ol{margin:8px 20px}
.bubble li{margin-bottom:4px}
.bubble strong{font-weight:700;color:var(--accent)}

.bubble code{
  background:rgba(128,128,128,.15); padding:3px 7px;
  border-radius:5px; font-family:'Courier New',monospace;
  font-size:13px; direction:ltr; display:inline-block;
}
.bubble pre{
  background:var(--code-bg); color:#e0e0e0; padding:16px;
  border-radius:12px; overflow-x:auto; margin:12px 0;
  direction:ltr; text-align:left; font-size:13px;
  line-height:1.65; position:relative;
  border:1px solid rgba(255,255,255,.05);
  box-shadow:0 4px 20px rgba(0,0,0,.2);
}
.bubble pre code{background:none;padding:0;color:inherit}
.copy-code{
  position:absolute; top:8px; left:8px;
  background:rgba(255,255,255,.1); border:none; color:#ccc;
  padding:5px 11px; border-radius:7px; font-size:11px;
  cursor:pointer; font-family:inherit; transition:.2s;
  backdrop-filter:blur(4px);
}
.copy-code:hover{background:rgba(255,255,255,.25);color:#fff;transform:scale(1.05)}

/* ═══ TABLES ═══ */
.bubble table{
  width:100%; border-collapse:collapse; margin:14px 0;
  font-size:13.5px; border-radius:12px; overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  animation:fadeUp .5s;
}
.bubble th{
  background:linear-gradient(135deg,var(--accent),#0d8a6b);
  color:#fff; padding:12px 14px; font-weight:600; text-align:right;
  position:relative;
}
.bubble td{padding:11px 14px;border-bottom:1px solid var(--border)}
.bubble tr{transition:background .2s}
.bubble tr:hover td{background:rgba(16,163,127,.05)}
.bubble tr:last-child td{border-bottom:none}
.bubble tr:nth-child(even) td{background:rgba(128,128,128,.04)}

/* ═══ KATEX ═══ */
.katex{font-size:1.05em;direction:ltr;display:inline-block}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:10px 0;direction:ltr}

/* ═══ CURSOR ═══ */
.cursor{
  display:inline-block; width:8px; height:17px;
  background:var(--accent); margin-right:3px;
  animation:blink .9s infinite; vertical-align:middle;
  border-radius:2px; box-shadow:0 0 8px var(--accent);
}
@keyframes blink{
  0%,50%{opacity:1;box-shadow:0 0 8px var(--accent)}
  51%,100%{opacity:0;box-shadow:none}
}

/* ═══ LOADING DOTS ═══ */
.dots{display:inline-flex;gap:6px;align-items:center;padding:8px 0}
.dots span{
  width:9px;height:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:50%;
  animation:bounce 1.4s cubic-bezier(.4,0,.2,1) infinite;
  box-shadow:0 2px 8px rgba(16,163,127,.3);
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{
  0%,60%,100%{transform:translateY(0) scale(1);opacity:.5}
  30%{transform:translateY(-12px) scale(1.2);opacity:1}
}

/* ═══ INPUT (بالاتر اومده) ═══ */
.input-wrap{
  position:absolute; bottom:0; right:0; left:0;
  padding:16px 20px calc(22px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 55%, transparent);
  pointer-events:none; z-index:5;
}
.input-box{
  max-width:820px; margin:0 auto;
  background:var(--input-bg); border:1px solid var(--border);
  border-radius:20px;
  padding:10px 10px 10px 18px;
  display:flex; align-items:flex-end; gap:10px;
  box-shadow:var(--shadow);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  pointer-events:auto;
}
.input-box:focus-within{
  border-color:var(--accent);
  box-shadow:var(--glow), 0 8px 30px rgba(16,163,127,.15);
  transform:translateY(-2px);
}
#inp{
  flex:1; background:transparent; border:none;
  color:var(--text); font-family:inherit; font-size:15px;
  resize:none; outline:none; padding:11px 8px;
  max-height:200px; line-height:1.6;
  transition:height .2s;
}
#inp::placeholder{color:var(--muted);transition:.3s}
#inp:focus::placeholder{opacity:.6}

.send{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none; color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  flex-shrink:0; position:relative; overflow:hidden;
}
.send::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.4),transparent);
  transform:translateX(-100%) rotate(45deg); transition:transform .5s;
}
.send:hover:not(:disabled)::before{transform:translateX(100%) rotate(45deg)}
.send:hover:not(:disabled){transform:scale(1.08) rotate(-5deg);box-shadow:0 8px 20px rgba(16,163,127,.4)}
.send:active:not(:disabled){transform:scale(.95)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:22px;height:22px;transition:transform .3s}
.send:hover svg{transform:translateX(-2px)}

.stop{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  border:none; color:#fff; cursor:pointer;
  display:none; align-items:center; justify-content:center;
  transition:all .3s cubic-bezier(.4,0,.2,1); flex-shrink:0;
}
.stop.on{display:flex;animation:stopIn .3s}
@keyframes stopIn{
  from{transform:scale(0);opacity:0}
  to{transform:scale(1);opacity:1}
}
.stop:hover{transform:scale(1.08);box-shadow:0 8px 20px rgba(239,68,68,.4)}
.stop:active{transform:scale(.95)}

.hint{
  text-align:center;font-size:11px;color:var(--muted);
  margin-top:10px;opacity:.7;transition:.3s;
}
.hint:hover{opacity:1}

/* ═══ MOBILE ═══ */
@media(max-width:768px){
  .app{grid-template-columns:0 1fr}
  .app.open{grid-template-columns:280px 1fr}
  .sidebar{
    position:fixed; top:0; bottom:0; right:0; z-index:100;
    box-shadow:-4px 0 30px rgba(0,0,0,.2);
    transform:translateX(0); transition:transform .4s cubic-bezier(.4,0,.2,1);
  }
  .app:not(.open) .sidebar{transform:translateX(100%)}
  .welcome h1{font-size:22px}
  .w-logo{width:70px;height:70px;font-size:30px}
  .msgs{padding:16px 12px 170px}
  .input-wrap{padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
  .input-box{border-radius:18px;padding:8px 8px 8px 14px}
  .send,.stop{width:42px;height:42px;border-radius:12px}
}

/* تبلت */
@media(min-width:769px) and (max-width:1024px){
  .input-wrap{padding:18px 20px calc(30px + env(safe-area-inset-bottom))}
  .msgs{padding:24px 20px 200px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat" onclick="newChat()"><span>＋</span><span>گفتگوی جدید</span></button>
    </div>
    <div class="history" id="history"></div>
    <div class="s-foot">
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="tIcon">🌙</span><span id="tLabel">حالت تاریک</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="brand">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo">آ</div>
        <span>آلفا بات</span>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msgs" id="msgs"></div>
    </div>

    <div class="input-wrap">
      <div class="input-box">
        <textarea id="inp" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
        <button class="send" id="sendBtn" onclick="send()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
        <button class="stop" id="stopBtn" onclick="stopGen()">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="hint">آلفا بات ممکن است اشتباه کند. اطلاعات مهم را بررسی کنید.</div>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════
//  فقط این دو خط رو ویرایش کن:
// ═══════════════════════════════════════════
const API_KEY = 'sk-04z3Brfq5K1ce4OBJ7QipeHAR9gdupCUWsBzMPn0FuN2HHyI';
const MODEL   = ''; // ← اسم مدل خودت رو اینجا بذار
// ═══════════════════════════════════════════

const API_URL = 'https://api.avalai.ir/v1/chat/completions';
const STORAGE = 'alfabot_chats';
const THEME_KEY = 'alfabot_theme';
const LAST_CHAT_KEY = 'alfabot_last';

let chats = JSON.parse(localStorage.getItem(STORAGE) || '[]');
let currentId = localStorage.getItem(LAST_CHAT_KEY);
let generating = false;
let aborter = null;

marked.setOptions({
  breaks: true, gfm: true,
  highlight(code, lang){
    if(lang && hljs.getLanguage(lang)){
      try{ return hljs.highlight(code,{language:lang}).value; }catch(e){}
    }
    return hljs.highlightAuto(code).value;
  }
});

// ═══ THEME ═══
function initTheme(){
  const t = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  updateThemeUI(t);
}
function toggleTheme(){
  const c = document.documentElement.getAttribute('data-theme');
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem(THEME_KEY, n);
  updateThemeUI(n);
}
function updateThemeUI(t){
  document.getElementById('tIcon').textContent = t==='dark'?'☀️':'🌙';
  document.getElementById('tLabel').textContent = t==='dark'?'حالت روشن':'حالت تاریک';
}

// ═══ SIDEBAR ═══
function toggleSidebar(){
  document.getElementById('app').classList.toggle('open');
}

// ═══ CHATS ═══
function save(){
  localStorage.setItem(STORAGE, JSON.stringify(chats));
  if(currentId) localStorage.setItem(LAST_CHAT_KEY, currentId);
}
function newChat(){
  currentId = null;
  localStorage.removeItem(LAST_CHAT_KEY);
  document.getElementById('msgs').innerHTML = '';
  renderWelcome();
  renderHistory();
  document.getElementById('app').classList.remove('open');
}
function currentChat(){ return chats.find(c=>c.id===currentId); }
function loadChat(id){
  currentId = id;
  const c = currentChat();
  if(!c) return;
  document.getElementById('msgs').innerHTML = '';
  c.messages.forEach(m=>addMsg(m.role, m.content, false));
  renderHistory();
  scrollBottom();
  document.getElementById('app').classList.remove('open');
}
function delChat(id, e){
  e.stopPropagation();
  chats = chats.filter(c=>c.id!==id);
  if(currentId===id) newChat();
  save(); renderHistory();
}
function renderHistory(){
  const el = document.getElementById('history');
  if(!chats.length){
    el.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px;">هنوز گفتگویی ندارید</div>';
    return;
  }
  el.innerHTML = chats.map(c=>`
    <div class="h-item ${c.id===currentId?'active':''}" onclick="loadChat('${c.id}')">
      <span style="overflow:hidden;text-overflow:ellipsis;">💬 ${esc(c.title)}</span>
      <button class="del" onclick="delChat('${c.id}',event)">×</button>
    </div>`).join('');
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ═══ MESSAGES ═══
function addMsg(role, content, animate=true){
  const w = document.querySelector('.welcome');
  if(w) w.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user'?'user':'ai');
  if(!animate) div.style.animation = 'none';

  const avatar = role==='user' ? '👤' : 'آ';
  div.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="bubble"></div>`;

  const bubble = div.querySelector('.bubble');

  if(role==='user'){
    bubble.textContent = content;
  }else{
    bubble.innerHTML = renderMD(content);
    addCopyButtons(bubble);
  }

  document.getElementById('msgs').appendChild(div);
  scrollBottom();
  return bubble;
}

// ═══ MARKDOWN ═══
function renderMD(text){
  const mathBlocks = [];
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr)=>{
    mathBlocks.push({type:'block', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });
  text = text.replace(/\$([^\$\n]+?)\$/g, (m, expr)=>{
    mathBlocks.push({type:'inline', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });
  text = text.replace(/\\\[([\s\S]+?)\\\]/g, (m, expr)=>{
    mathBlocks.push({type:'block', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });
  text = text.replace(/\\\(([\s\S]+?)\\\)/g, (m, expr)=>{
    mathBlocks.push({type:'inline', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });

  let html = marked.parse(text);

  html = html.replace(/@@MATH(\d+)@@/g, (m, i)=>{
    const mb = mathBlocks[+i];
    try{
      return katex.renderToString(mb.expr, {
        displayMode: mb.type==='block',
        throwOnError: false
      });
    }catch(e){
      return mb.expr;
    }
  });

  return html;
}

function addCopyButtons(container){
  container.querySelectorAll('pre').forEach(pre=>{
    if(pre.querySelector('.copy-code')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-code';
    btn.textContent = 'کپی';
    btn.onclick = ()=>{
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
      btn.textContent = '✓ شد';
      setTimeout(()=>btn.textContent='کپی', 1500);
    };
    pre.appendChild(btn);
  });
}

// ═══ SEND ═══
async function send(){
  if(generating) return;

  if(!MODEL){
    alert('⚠️ اسم مدل رو توی کد تنظیم کن!\n\nخط MODEL = \'\' رو پر کن.');
    return;
  }

  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;

  if(!currentId){
    currentId = Date.now().toString();
    chats.unshift({
      id: currentId,
      title: text.slice(0, 40),
      messages: []
    });
    save();
    renderHistory();
  }

  const chat = currentChat();
  chat.messages.push({role:'user', content:text});
  save();

  inp.value = '';
  autoResize(inp);
  addMsg('user', text);

  const bubble = addMsg('ai', '');
  bubble.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';

  generating = true;
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').classList.add('on');

  aborter = new AbortController();

  const apiMessages = [
    {role:'system', content:`تو یک دستیار هوشمند فارسی‌زبان به نام «آلفا بات» هستی. 
- همیشه به فارسی پاسخ بده.
- از Markdown استفاده کن (تیتر، لیست، **بولد** و...).
- برای فرمول‌های ریاضی از LaTeX استفاده کن: داخل $...$ برای فرمول‌های خطی و $$...$$ برای فرمول‌های بلوکی.
- برای کسرها از \\frac{a}{b} استفاده کن.
- برای نتیجه‌گیری و مقایسه، حتماً از جدول Markdown استفاده کن.
- پاسخ‌ها را با جزئیات و کامل بده.`},
    ...chat.messages.slice(-20).map(m=>({role:m.role, content:m.content}))
  ];

  let fullText = '';
  let typingTimer = null;
  let displayedText = '';

  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: MODEL,
        messages: apiMessages,
        stream: true,
        temperature: 0.7
      }),
      signal: aborter.signal
    });

    if(!res.ok){
      throw new Error(`API Error ${res.status}: ${await res.text()}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let firstChunk = true;

    while(true){
      const {done, value} = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for(const line of lines){
        const trimmed = line.trim();
        if(!trimmed || !trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if(data === '[DONE]') continue;
        try{
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if(delta){
            if(firstChunk){ bubble.innerHTML = ''; firstChunk = false; }
            fullText += delta;
          }
        }catch(e){}
      }

      if(firstChunk === false && !typingTimer){
        typingTimer = setInterval(()=>{
          if(displayedText.length < fullText.length){
            displayedText = fullText.slice(0, Math.min(displayedText.length + 3, fullText.length));
            bubble.innerHTML = renderMD(displayedText) + '<span class="cursor"></span>';
            addCopyButtons(bubble);
            scrollBottom();
          }else{
            clearInterval(typingTimer);
            typingTimer = null;
          }
        }, 15);
      }
    }

    await new Promise(resolve=>{
      const check = setInterval(()=>{
        if(displayedText.length >= fullText.length){
          clearInterval(check);
          resolve();
        }
      }, 30);
    });

    if(typingTimer) clearInterval(typingTimer);
    displayedText = fullText;
    bubble.innerHTML = renderMD(fullText);
    addCopyButtons(bubble);
    scrollBottom();

    chat.messages.push({role:'assistant', content:fullText});
    save();

  }catch(err){
    if(err.name === 'AbortError'){
      if(fullText){
        bubble.innerHTML = renderMD(fullText);
        addCopyButtons(bubble);
        chat.messages.push({role:'assistant', content:fullText});
        save();
      }else{
        bubble.innerHTML = '<span style="color:#ef4444;">توقف توسط کاربر</span>';
      }
    }else{
      console.error(err);
      bubble.innerHTML = `<div style="color:#ef4444;">⚠️ خطا در ارتباط با سرور<br><small style="opacity:.7;font-size:12px;">${esc(err.message)}</small></div>`;
    }
  }finally{
    generating = false;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').classList.remove('on');
    aborter = null;
  }
}

function stopGen(){
  if(aborter) aborter.abort();
}

// ═══ INPUT ═══
function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}
document.getElementById('inp').addEventListener('input', e=>autoResize(e.target));
document.getElementById('inp').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

function scrollBottom(){
  const box = document.getElementById('chatBox');
  requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
}

// ═══ INIT ═══
initTheme();

// اگه آخرین گفتگو وجود داره، بازش کن
if(currentId && chats.find(c=>c.id===currentId)){
  loadChat(currentId);
}else if(chats.length){
  loadChat(chats[0].id);
}else{
  renderWelcome();
}
renderHistory();
</script>
