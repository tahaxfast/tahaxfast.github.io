<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلفا بات | دستیار هوشمند</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

<style>
:root{
  --bg:#f7f7f8; --sidebar:#ffffff; --text:#1a1a1a; --muted:#6b7280;
  --border:#e5e7eb; --accent:#10a37f; --accent2:#14b88f;
  --user-bg:#10a37f; --user-text:#fff; --ai-bg:#ffffff; --ai-text:#1a1a1a;
  --input-bg:#ffffff; --code-bg:#1e1e1e;
  --shadow:0 4px 20px rgba(0,0,0,.06);
}
[data-theme="dark"]{
  --bg:#212121; --sidebar:#171717; --text:#ececec; --muted:#9ca3af;
  --border:#2f2f2f; --accent:#10a37f; --accent2:#14b88f;
  --user-bg:#10a37f; --user-text:#fff; --ai-bg:#2f2f2f; --ai-text:#ececec;
  --input-bg:#2f2f2f; --code-bg:#0d0d0d;
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
  transition:background .3s,color .3s;
}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;transition:grid-template-columns .3s}
.app.closed{grid-template-columns:0 1fr}

/* SIDEBAR */
.sidebar{background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:.3s}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.new-chat{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.new-chat:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,163,127,.3)}
.history{flex:1;overflow-y:auto;padding:8px}
.history::-webkit-scrollbar{width:6px}
.history::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.h-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s;display:flex;justify-content:space-between;align-items:center;gap:6px}
.h-item:hover{background:rgba(128,128,128,.1)}
.h-item.active{background:rgba(16,163,127,.15);color:var(--accent)}
.h-item .del{opacity:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;transition:.15s}
.h-item:hover .del{opacity:1}
.h-item .del:hover{color:#ef4444}
.s-foot{padding:12px;border-top:1px solid var(--border)}
.theme-btn{width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.theme-btn:hover{background:rgba(128,128,128,.1)}

/* MAIN */
.main{display:flex;flex-direction:column;height:100vh;position:relative;overflow:hidden}
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:10}
.menu-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:6px 10px;border-radius:6px;transition:.15s}
.menu-btn:hover{background:rgba(128,128,128,.1)}
.model-sel{background:var(--input-bg);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;outline:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:14px}

/* CHAT */
.chat-box{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-box::-webkit-scrollbar{width:8px}
.chat-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.msgs{max-width:820px;margin:0 auto;padding:24px 20px 160px}

/* Welcome */
.welcome{text-align:center;padding:60px 20px;animation:fadeUp .6s ease}
.w-logo{width:76px;height:76px;background:linear-gradient(135deg,var(--accent),var(--accent2),#0d8a6b);border-radius:22px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;box-shadow:0 12px 40px rgba(16,163,127,.3);animation:pulse 3s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 12px 40px rgba(16,163,127,.3)}50%{transform:scale(1.05);box-shadow:0 16px 50px rgba(16,163,127,.5)}}
.welcome h1{font-size:28px;margin-bottom:12px;font-weight:700}
.welcome p{color:var(--muted);font-size:15px;margin-bottom:40px}
.suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:640px;margin:0 auto}
.sug{background:var(--sidebar);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:right;cursor:pointer;transition:.2s;font-family:inherit;color:var(--text);font-size:13px}
.sug:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.sug .ic{font-size:22px;margin-bottom:8px;display:block}
.sug .t{font-weight:600;margin-bottom:4px}
.sug .d{color:var(--muted);font-size:12px}

/* Messages */
.msg{display:flex;gap:12px;margin-bottom:20px;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.msg.user .avatar{background:var(--user-bg);color:#fff}
.msg.ai .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bubble{padding:12px 16px;border-radius:14px;line-height:1.9;font-size:14.5px;word-wrap:break-word;overflow-wrap:break-word;box-shadow:var(--shadow);max-width:100%}
.msg.user .bubble{background:var(--user-bg);color:var(--user-text);border-top-right-radius:4px}
.msg.ai .bubble{background:var(--ai-bg);color:var(--ai-text);border-top-left-radius:4px;flex:1}

/* Markdown */
.bubble p{margin-bottom:10px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{margin:14px 0 8px;font-weight:700}
.bubble h1{font-size:20px}.bubble h2{font-size:17px}.bubble h3{font-size:15px}
.bubble ul,.bubble ol{margin:8px 20px}
.bubble li{margin-bottom:4px}
.bubble code{background:rgba(128,128,128,.15);padding:2px 6px;border-radius:4px;font-family:'Courier New',monospace;font-size:13px;direction:ltr;display:inline-block}
.bubble pre{background:var(--code-bg);color:#e0e0e0;padding:14px;border-radius:10px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left;font-size:13px;line-height:1.6;position:relative}
.bubble pre code{background:none;padding:0;color:inherit}
.copy-code{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.1);border:none;color:#ccc;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.copy-code:hover{background:rgba(255,255,255,.2);color:#fff}

/* Tables */
.bubble table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bubble th{background:linear-gradient(135deg,var(--accent),#0d8a6b);color:#fff;padding:10px 12px;font-weight:600;text-align:right}
.bubble td{padding:10px 12px;border-bottom:1px solid var(--border)}
.bubble tr:last-child td{border-bottom:none}
.bubble tr:nth-child(even) td{background:rgba(128,128,128,.05)}

/* KaTeX */
.katex{font-size:1.05em;direction:ltr;display:inline-block}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:8px 0;direction:ltr}

/* Typing cursor */
.cursor{display:inline-block;width:8px;height:16px;background:var(--accent);margin-right:3px;animation:blink 1s infinite;vertical-align:middle;border-radius:2px}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* Loading dots */
.dots{display:inline-flex;gap:5px;align-items:center;padding:6px 0}
.dots span{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-8px);opacity:1}}

/* INPUT */
.input-wrap{position:absolute;bottom:0;right:0;left:0;padding:16px 20px 20px;background:linear-gradient(to top,var(--bg) 60%,transparent);pointer-events:none}
.input-box{max-width:820px;margin:0 auto;background:var(--input-bg);border:1px solid var(--border);border-radius:18px;padding:8px 8px 8px 16px;display:flex;align-items:flex-end;gap:8px;box-shadow:var(--shadow);transition:.2s;pointer-events:auto}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,163,127,.15),var(--shadow)}
#inp{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:15px;resize:none;outline:none;padding:10px 8px;max-height:200px;line-height:1.6}
#inp::placeholder{color:var(--muted)}
.send{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.send:hover:not(:disabled){transform:scale(1.05);box-shadow:0 4px 12px rgba(16,163,127,.4)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:20px;height:20px}
.stop{width:42px;height:42px;border-radius:12px;background:#ef4444;border:none;color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;transition:.2s}
.stop.on{display:flex}
.stop:hover{background:#dc2626;transform:scale(1.05)}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

@media(max-width:768px){
  .app{grid-template-columns:0 1fr}
  .app.open{grid-template-columns:280px 1fr}
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .app:not(.open) .sidebar{transform:translateX(100%)}
  .welcome h1{font-size:22px}
  .msgs{padding:16px 12px 160px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat" onclick="newChat()"><span>＋</span><span>گفتگوی جدید</span></button>
    </div>
    <div class="history" id="history"></div>
    <div class="s-foot">
      <button class="theme-btn" onclick="toggleTheme()">

      </button>
    </div>
  </aside>

    <div class="topbar">

        <button class="menu-btn" onclick="toggleSidebar()">☰</button>

        <span>آلفا بات</span>
      </div>

        <option value="gpt-4o-mini">GPT-4o mini</option>
        <option value="gpt-4o" selected>GPT-4o</option>

      </select>

    <div class="chat-box" id="chatBox">

    </div>

</div>

<script>
// ========== CONFIG ==========
const API_KEY = 'sk-04z3Brfq5K1ce4OBJ7QipeHAR9gdupCUWsBzMPn0FuN2HHyI';
const API_URL = 'https://api.avalai.ir/v1/chat/completions';
const STORAGE = 'alfabot_chats';
const THEME_KEY = 'alfabot_theme';

// ========== STATE ==========
let chats = JSON.parse(localStorage.getItem(STORAGE) || '[]');
let currentId = null;
let generating = false;
let aborter = null;

// ========== MARKED ==========
marked.setOptions({
  breaks: true, gfm: true,
  highlight(code, lang){
    if(lang && hljs.getLanguage(lang)){
      try{ return hljs.highlight(code,{language:lang}).value; }catch(e){}
    }
    return hljs.highlightAuto(code).value;
  }
});

// ========== THEME ==========
function initTheme(){
  const t = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  updateThemeUI(t);
}
function toggleTheme(){
  const c = document.documentElement.getAttribute('data-theme');
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem(THEME_KEY, n);
  updateThemeUI(n);
}
function updateThemeUI(t){
  document.getElementById('tIcon').textContent = t==='dark'?'☀️':'🌙';
  document.getElementById('tLabel').textContent = t==='dark'?'حالت روشن':'حالت تاریک';
}

// ========== SIDEBAR ==========
function toggleSidebar(){
  document.getElementById('app').classList.toggle('open');
}

// ========== CHATS ==========
function save(){ localStorage.setItem(STORAGE, JSON.stringify(chats)); }
function newChat(){
  currentId = null;
  document.getElementById('msgs').innerHTML = '';
  renderWelcome();
  renderHistory();
  document.getElementById('app').classList.remove('open');
}
function currentChat(){ return chats.find(c=>c.id===currentId); }
function loadChat(id){
  currentId = id;
  const c = currentChat();
  if(!c) return;
  document.getElementById('msgs').innerHTML = '';
  c.messages.forEach(m=>addMsg(m.role, m.content, false));
  renderHistory();
  scrollBottom();
  document.getElementById('app').classList.remove('open');
}
function delChat(id, e){
  e.stopPropagation();
  chats = chats.filter(c=>c.id!==id);
  if(currentId===id) newChat();
  save(); renderHistory();
}
function renderHistory(){
  const el = document.getElementById('history');
  if(!chats.length){
    el.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px;">هنوز گفتگویی ندارید</div>';
    return;
  }
  el.innerHTML = chats.map(c=>`
    <div class="h-item ${c.id===currentId?'active':''}" onclick="loadChat('${c.id}')">
      <span style="overflow:hidden;text-overflow:ellipsis;">💬 ${esc(c.title)}</span>
      <button class="del" onclick="delChat('${c.id}',event)">×</button>
    </div>`).join('');
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ========== WELCOME ==========
function renderWelcome(){
  document.getElementById('msgs').innerHTML = `
    <div class="welcome">
      <div class="w-logo">آ</div>
      <h1>سلام! من آلفا بات هستم</h1>
      <p>چطور می‌تونم امروز کمکت کنم؟</p>
      <div class="suggestions">
        <button class="sug" onclick="useSug('یک معادله درجه دو رو با فرمول کامل حل کن و نتیجه رو در جدول نشون بده')">
          <span class="ic">📐</span><div class="t">حل معادله ریاضی</div><div class="d">با فرمول و جدول</div>
        </button>
        <button class="sug" onclick="useSug('یک برنامه پایتون برای مرتب‌سازی لیست بنویس')">
          <span class="ic">💻</span><div class="t">کدنویسی</div><div class="d">پایتون، جاوااسکریپت و...</div>
        </button>
        <button class="sug" onclick="useSug('یه متن ادبی زیبا درباره پاییز بنویس')">
          <span class="ic">✍️</span><div class="t">نوشتن متن</div><div class="d">ادبی، رسمی، دوستانه</div>
        </button>
        <button class="sug" onclick="useSug('فرق بین هوش مصنوعی و یادگیری ماشین رو در جدول توضیح بده')">
          <span class="ic">🧠</span><div class="t">توضیح مفهومی</div><div class="d">با جدول مقایسه</div>
        </button>
      </div>
    </div>`;
}
function useSug(t){
  document.getElementById('inp').value = t;
  autoResize(document.getElementById('inp'));
  send();
}

// ========== MESSAGES ==========
function addMsg(role, content, animate=true){
  const w = document.querySelector('.welcome');
  if(w) w.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user'?'user':'ai');
  if(!animate) div.style.animation = 'none';

  const avatar = role==='user' ? '👤' : 'آ';
  div.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="bubble"></div>`;

  const bubble = div.querySelector('.bubble');

  if(role==='user'){
    bubble.textContent = content;
  }else{
    // Render AI message with markdown + math + code
    bubble.innerHTML = renderMD(content);
    addCopyButtons(bubble);
  }

  document.getElementById('msgs').appendChild(div);
  scrollBottom();
  return bubble;
}

// ========== MARKDOWN RENDER ==========
function renderMD(text){
  // First protect math blocks
  const mathBlocks = [];
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr)=>{
    mathBlocks.push({type:'block', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });
  text = text.replace(/\$([^\$\n]+?)\$/g, (m, expr)=>{
    mathBlocks.push({type:'inline', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });
  text = text.replace(/\\\[([\s\S]+?)\\\]/g, (m, expr)=>{
    mathBlocks.push({type:'block', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });
  text = text.replace(/\\\(([\s\S]+?)\\\)/g, (m, expr)=>{
    mathBlocks.push({type:'inline', expr});
    return `@@MATH${mathBlocks.length-1}@@`;
  });

  let html = marked.parse(text);

  // Restore math
  html = html.replace(/@@MATH(\d+)@@/g, (m, i)=>{
    const mb = mathBlocks[+i];
    try{
      return katex.renderToString(mb.expr, {
        displayMode: mb.type==='block',
        throwOnError: false
      });
    }catch(e){
      return mb.expr;
    }
  });

  return html;
}

function addCopyButtons(container){
  container.querySelectorAll('pre').forEach(pre=>{
    if(pre.querySelector('.copy-code')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-code';
    btn.textContent = 'کپی';
    btn.onclick = ()=>{
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
      btn.textContent = '✓ شد';
      setTimeout(()=>btn.textContent='کپی', 1500);
    };
    pre.appendChild(btn);
  });
}

// ========== TYPING ANIMATION ==========
async function typeText(bubble, fullText){
  // For streaming we show live; but if not streaming this animates
  // We use direct streaming instead here (handled by send()).
  bubble.innerHTML = renderMD(fullText);
  addCopyButtons(bubble);
}

// ========== SEND ==========
async function send(){
  if(generating) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;

  // Create chat if needed
  if(!currentId){
    currentId = Date.now().toString();
    chats.unshift({
      id: currentId,
      title: text.slice(0, 40),
      messages: []
    });
    save();
    renderHistory();
  }

  const chat = currentChat();
  chat.messages.push({role:'user', content:text});
  save();

  inp.value = '';
  autoResize(inp);
  addMsg('user', text);

  // AI message placeholder
  const bubble = addMsg('ai', '');
  bubble.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';

  generating = true;
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').classList.add('on');

  aborter = new AbortController();

  const model = document.getElementById('model').value;

  // Prepare messages for API
  const apiMessages = [
    {role:'system', content:`تو یک دستیار هوشمند فارسی‌زبان به نام «آلفا بات» هستی. 
- همیشه به فارسی پاسخ بده.
- از Markdown استفاده کن (تیتر، لیست، **بولد** و...).
- برای فرمول‌های ریاضی از LaTeX استفاده کن: داخل $...$ برای فرمول‌های خطی و $$...$$ برای فرمول‌های بلوکی.
- برای کسرها از \\frac{a}{b} استفاده کن.
- برای نتیجه‌گیری و مقایسه، حتماً از جدول Markdown استفاده کن.
- پاسخ‌ها را با جزئیات و کامل بده.`},
    ...chat.messages.slice(-20).map(m=>({role:m.role, content:m.content}))
  ];

  let fullText = '';
  let typingTimer = null;
  let displayedText = '';

  function startTypingEffect(){
    // Progressive render for smoothness
    if(typingTimer) clearInterval(typingTimer);
    typingTimer = setInterval(()=>{
      if(displayedText.length < fullText.length){
        displayedText = fullText.slice(0, Math.min(displayedText.length + 3, fullText.length));
        bubble.innerHTML = renderMD(displayedText) + '<span class="cursor"></span>';
        addCopyButtons(bubble);
        scrollBottom();
      }
    }, 15);
  }

  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model,
        messages: apiMessages,
        stream: true,
        temperature: 0.7
      }),
      signal: aborter.signal
    });

    if(!res.ok){
      throw new Error(`API Error ${res.status}: ${await res.text()}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let firstChunk = true;

    while(true){
      const {done, value} = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for(const line of lines){
        const trimmed = line.trim();
        if(!trimmed || !trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if(data === '[DONE]') continue;
        try{
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if(delta){
            if(firstChunk){ bubble.innerHTML = ''; firstChunk = false; }
            fullText += delta;
          }
        }catch(e){}
      }

      // Live typing effect
      if(firstChunk === false){
        if(displayedText.length < fullText.length){
          if(!typingTimer){
            typingTimer = setInterval(()=>{
              if(displayedText.length < fullText.length){
                displayedText = fullText.slice(0, Math.min(displayedText.length + 3, fullText.length));
                bubble.innerHTML = renderMD(displayedText) + '<span class="cursor"></span>';
                addCopyButtons(bubble);
                scrollBottom();
              }else{
                clearInterval(typingTimer);
                typingTimer = null;
              }
            }, 15);
          }
        }
      }
    }

    // Finish remaining
    if(typingTimer) clearInterval(typingTimer);
    displayedText = fullText;
    bubble.innerHTML = renderMD(fullText);
    addCopyButtons(bubble);
    scrollBottom();

    chat.messages.push({role:'assistant', content:fullText});
    save();

  }catch(err){
    if(err.name === 'AbortError'){
      if(fullText){
        bubble.innerHTML = renderMD(fullText);
        addCopyButtons(bubble);
        chat.messages.push({role:'assistant', content:fullText});
        save();
      }else{
        bubble.innerHTML = '<span style="color:#ef4444;">توقف توسط کاربر</span>';
      }
    }else{
      console.error(err);
      bubble.innerHTML = `<div style="color:#ef4444;">⚠️ خطا در ارتباط با سرور<br><small style="opacity:.7;font-size:12px;">${esc(err.message)}</small></div>`;
    }
  }finally{
    generating = false;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').classList.remove('on');
    aborter = null;
  }
}

function stopGen(){
  if(aborter) aborter.abort();
}

// ========== INPUT ==========
function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}
document.getElementById('inp').addEventListener('input', e=>autoResize(e.target));
document.getElementById('inp').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

// ========== UTILS ==========
function scrollBottom(){
  const box = document.getElementById('chatBox');
  requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
}

// ========== INIT ==========
initTheme();
if(chats.length){
  loadChat(chats[0].id);
}else{
  renderWelcome();
}
renderHistory();
</script>
