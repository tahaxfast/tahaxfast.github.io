<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0d0d0d"/>
<title>AlphaBot | هوش مصنوعی فارسی هوشمند</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>"/>

<style>
/* ============================================================
   🎨 DeepSeek-style Theme (منطبق با درخواست شما)
   ============================================================ */
:root{
  --bg: #0d0d0d;
  --bg-2: #171717;
  --bg-3: #1f1f1f;
  --bg-4: #262626;
  --bg-hover: #2a2a2a;
  --bg-sidebar: #0a0a0a;
  --bg-sidebar-hover: #171717;
  --bg-sidebar-active: #1f1f1f;
  --bg-chat: #0d0d0d;

  --text: #ececec;
  --text-2: #b8b8b8;
  --text-3: #7a7a7a;
  --text-muted: #5a5a5a;

  --primary: #4d9cf7;
  --primary-hover: #3b82e0;
  --primary-soft: rgba(77,156,247,.12);
  --primary-glow: rgba(77,156,247,.35);

  --success: #4ade80;
  --danger: #f87171;
  --warning: #fbbf24;

  --border: #1f1f1f;
  --border-2: #2a2a2a;
  --border-3: #3a3a3a;

  --user-bubble: #2a2a2a;
  --ai-bubble: transparent;

  --code-bg: #1a1a1a;
  --code-border: #2a2a2a;

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-full: 9999px;

  --shadow: 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.5);

  --ease: cubic-bezier(.4,0,.2,1);
  --bounce: cubic-bezier(.34,1.56,.64,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-3)}
::selection{background:var(--primary);color:#fff}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes cursor{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--primary-glow)}50%{box-shadow:0 0 20px var(--primary-glow)}}

/* ============================================================
   📱 Screens
   ============================================================ */
.screen{display:none;width:100%;height:100vh;position:relative}
.screen.active{display:flex;animation:fadeIn .3s}

/* ============================================================
   🔐 AUTH
   ============================================================ */
.auth-screen{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100vh;background:var(--bg);
  padding:20px;position:relative;overflow:hidden;
}
.auth-screen::before{
  content:'';position:absolute;top:-30%;right:-15%;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(77,156,247,.12),transparent 70%);
  border-radius:50%;animation:pulse 8s infinite;
}
.auth-screen::after{
  content:'';position:absolute;bottom:-30%;left:-15%;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(77,156,247,.08),transparent 70%);
  border-radius:50%;animation:pulse 10s infinite reverse;
}
.auth-container{width:100%;max-width:400px;position:relative;z-index:1;animation:scaleIn .4s}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo-icon{
  width:76px;height:76px;margin:0 auto 18px;
  border-radius:20px;background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;color:#fff;
  box-shadow:0 0 40px var(--primary-glow);
}
.auth-title{font-size:1.6rem;font-weight:900;letter-spacing:-.5px;margin-bottom:8px}
.auth-title .hl{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.auth-subtitle{color:var(--text-3);font-size:.85rem}
.auth-tabs{
  display:flex;gap:4px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r);
  padding:4px;margin-bottom:22px;
}
.auth-tab{
  flex:1;padding:10px;border:none;background:transparent;
  color:var(--text-2);font-family:inherit;font-size:.85rem;
  font-weight:700;cursor:pointer;border-radius:8px;transition:.2s;
}
.auth-tab.active{background:var(--bg-3);color:var(--primary)}
.auth-field{margin-bottom:14px}
.auth-field label{
  display:block;font-size:.8rem;color:var(--text-2);
  font-weight:600;margin-bottom:6px;
}
.auth-input{
  width:100%;padding:12px 16px;background:var(--bg-2);
  border:1px solid var(--border-2);border-radius:var(--r);
  color:var(--text);font-family:inherit;font-size:.9rem;
  outline:none;transition:.2s;
}
.auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.auth-input::placeholder{color:var(--text-muted)}
.auth-msg{
  padding:11px 14px;border-radius:var(--r);font-size:.82rem;
  font-weight:600;margin-bottom:14px;display:none;
}
.auth-msg.error{display:block;background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}
.auth-msg.success{display:block;background:rgba(74,222,128,.1);color:var(--success);border:1px solid rgba(74,222,128,.2)}
.auth-btn{
  width:100%;padding:13px;border:none;border-radius:var(--r);
  font-family:inherit;font-size:.92rem;font-weight:800;
  cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.auth-btn.primary{background:var(--primary);color:#fff}
.auth-btn.primary:hover{background:var(--primary-hover)}
.auth-btn.secondary{background:var(--bg-2);color:var(--text);border:1px solid var(--border-2)}
.auth-btn.secondary:hover{background:var(--bg-3)}

/* ============================================================
   💬 CHAT APP
   ============================================================ */
.chat-app{display:flex;width:100%;height:100vh;background:var(--bg)}

/* Sidebar */
.sidebar{
  width:260px;background:var(--bg-sidebar);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .3s var(--ease);
  flex-shrink:0;position:relative;z-index:100;
}
.sb-header{padding:10px;display:flex;align-items:center;gap:6px}
.sb-logo{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;transition:.2s;flex:1;
}
.sb-logo:hover{background:var(--bg-sidebar-hover)}
.sb-logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:.95rem;color:#fff;flex-shrink:0;
}
.sb-logo-text{font-size:.95rem;font-weight:800;letter-spacing:-.3px}
.sb-logo-text .alpha{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.sb-logo-text .bot{color:var(--text)}

.sb-new{
  margin:4px 10px 10px;padding:10px 14px;
  background:transparent;border:1px solid var(--border-2);
  border-radius:var(--r);color:var(--text);font-family:inherit;
  font-size:.85rem;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:.2s;
}
.sb-new:hover{background:var(--bg-sidebar-hover);border-color:var(--primary)}
.sb-new i{color:var(--primary);font-size:.8rem}

.sb-list{flex:1;overflow-y:auto;padding:4px 8px}
.sb-label{
  font-size:.65rem;color:var(--text-muted);font-weight:700;
  letter-spacing:1.5px;padding:12px 10px 6px;text-transform:uppercase;
}
.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;border-radius:var(--r-sm);
  cursor:pointer;transition:.2s;color:var(--text-2);
  font-size:.85rem;position:relative;margin-bottom:1px;
}
.sb-item:hover{background:var(--bg-sidebar-hover);color:var(--text)}
.sb-item.active{background:var(--bg-sidebar-active);color:var(--text)}
.sb-item i{font-size:.8rem;color:var(--text-3);flex-shrink:0}
.sb-item.active i,.sb-item:hover i{color:var(--primary)}
.sb-item-text{
  flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.sb-item .del{
  opacity:0;background:transparent;border:none;
  color:var(--text-3);cursor:pointer;padding:3px;
  border-radius:5px;transition:.2s;font-size:.7rem;
}
.sb-item:hover .del{opacity:1}
.sb-item .del:hover{color:var(--danger);background:rgba(248,113,113,.1)}

.sb-footer{padding:8px 10px;border-top:1px solid var(--border)}
.sb-user{
  width:100%;padding:8px 10px;background:transparent;border:none;
  border-radius:var(--r-sm);display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:.2s;font-family:inherit;color:var(--text);
  text-align:right;
}
.sb-user:hover{background:var(--bg-sidebar-hover)}
.sb-user-av{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:800;color:#fff;flex-shrink:0;
}
.sb-user-info{flex:1;min-width:0;text-align:right}
.sb-user-name{
  font-size:.83rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sb-user-plan{font-size:.68rem;color:var(--text-muted)}

/* Main */
.chat-main{
  flex:1;display:flex;flex-direction:column;
  background:var(--bg-chat);min-width:0;position:relative;
}
.chat-head{
  padding:10px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:var(--bg);z-index:10;min-height:56px;
}
.chat-head-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.menu-btn{
  display:none;width:36px;height:36px;border-radius:var(--r-sm);
  background:transparent;border:none;color:var(--text-2);
  cursor:pointer;align-items:center;justify-content:center;
  transition:.2s;font-size:.95rem;
}
.menu-btn:hover{background:var(--bg-2);color:var(--text)}
.head-title{display:flex;align-items:center;gap:8px}
.head-icon{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:#fff;
}
.head-name{font-size:.92rem;font-weight:800;letter-spacing:-.3px}
.head-name .alpha{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.head-name .bot{color:var(--text)}
.head-status{
  font-size:.68rem;color:var(--success);
  display:flex;align-items:center;gap:4px;font-weight:600;
}
.head-status::before{
  content:'';width:5px;height:5px;
  background:var(--success);border-radius:50%;
}
.head-actions{display:flex;gap:4px}

/* Toggle سرچ */
.search-toggle{
  display:flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:var(--r-full);
  background:transparent;border:1px solid var(--border-2);
  color:var(--text-2);font-family:inherit;font-size:.78rem;
  font-weight:600;cursor:pointer;transition:.2s;
}
.search-toggle:hover{background:var(--bg-2);color:var(--text)}
.search-toggle.active{
  background:var(--primary-soft);
  border-color:var(--primary);
  color:var(--primary);
}
.search-toggle i{font-size:.75rem}

.icon-btn{
  width:36px;height:36px;border-radius:var(--r-sm);
  background:transparent;border:none;color:var(--text-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s;font-size:.95rem;
}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}

/* Messages */
.messages{
  flex:1;overflow-y:auto;padding:20px 16px 12px;
  scroll-behavior:smooth;
}
.messages-inner{max-width:760px;margin:0 auto;padding-bottom:20px}

.welcome{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
  min-height:calc(100vh - 320px);padding:20px;
  animation:fadeIn .4s;
}
.welcome-icon{
  width:68px;height:68px;border-radius:18px;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:#fff;margin-bottom:20px;
  box-shadow:0 0 40px var(--primary-glow);
  animation:pulse 3s infinite;
}
.welcome h1{
  font-size:1.5rem;font-weight:800;
  margin-bottom:10px;letter-spacing:-.5px;
}
.welcome h1 span{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.welcome p{
  font-size:.9rem;color:var(--text-2);
  margin-bottom:28px;max-width:460px;line-height:1.9;
}
.suggestions{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;max-width:580px;width:100%;
}
.suggestion{
  padding:14px 16px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r);
  cursor:pointer;transition:.3s var(--bounce);
  text-align:right;font-size:.83rem;color:var(--text-2);
  display:flex;align-items:flex-start;gap:10px;
}
.suggestion:hover{
  background:var(--bg-3);border-color:var(--primary);
  color:var(--text);transform:translateY(-3px);
}
.suggestion i{color:var(--primary);font-size:.9rem;flex-shrink:0;margin-top:2px}

/* Message bubbles */
.msg{
  margin-bottom:20px;animation:fadeUp .3s;
  display:flex;gap:12px;
}
.msg.user{flex-direction:row-reverse}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:800;
}
.msg.user .msg-avatar{background:linear-gradient(135deg,#4d9cf7,#3b82e0);color:#fff}
.msg.ai .msg-avatar{background:linear-gradient(135deg,#3b82e0,#4d9cf7);color:#fff}
.msg-body{flex:1;min-width:0;max-width:100%}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.msg-name{
  font-size:.72rem;color:var(--text-3);
  font-weight:600;margin-bottom:4px;
}
.msg-content{
  font-size:.92rem;line-height:1.9;color:var(--text);
  word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;
}
.msg.user .msg-content{
  background:var(--user-bubble);padding:11px 16px;
  border-radius:16px;border-top-right-radius:4px;
  max-width:88%;display:inline-block;
}
.msg.ai .msg-content{padding:2px 0;max-width:100%}

/* Code block */
.code-block{
  position:relative;background:var(--code-bg);
  border:1px solid var(--code-border);border-radius:var(--r);
  margin:12px 0;overflow:hidden;direction:ltr;
}
.code-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--code-border);
}
.code-lang{
  font-size:.7rem;color:var(--text-3);
  font-weight:700;text-transform:uppercase;letter-spacing:1px;
  font-family:'Consolas','Monaco',monospace;
}
.code-actions{display:flex;gap:4px}
.code-act{
  background:transparent;border:none;color:var(--text-3);
  cursor:pointer;padding:5px 8px;border-radius:6px;
  font-size:.7rem;font-family:inherit;font-weight:600;
  display:flex;align-items:center;gap:4px;transition:.2s;
}
.code-act:hover{background:var(--bg-3);color:var(--text)}
.code-act i{font-size:.7rem}
.code-content{
  padding:14px;overflow-x:auto;
  font-family:'Consolas','Monaco',monospace;
  font-size:.84rem;line-height:1.6;color:#e0e0e0;
  white-space:pre;
}
.msg-content pre{
  background:var(--code-bg);border:1px solid var(--code-border);
  padding:14px;border-radius:var(--r);margin:12px 0;
  overflow-x:auto;direction:ltr;text-align:left;
  font-family:'Consolas','Monaco',monospace;
  font-size:.84rem;line-height:1.6;white-space:pre;
}
.msg-content code{
  background:var(--code-bg);border:1px solid var(--code-border);
  padding:2px 6px;border-radius:4px;
  font-family:'Consolas','Monaco',monospace;
  font-size:.84rem;direction:ltr;display:inline-block;
  color:#60a5fa;
}
.msg-content strong{color:#fff;font-weight:700}
.msg-content a{color:var(--primary);text-decoration:underline}
.msg-content ul,
.msg-content ol{padding-right:20px;margin:8px 0}
.msg-content li{margin-bottom:4px}
.msg-content h1,
.msg-content h2,
.msg-content h3{margin:14px 0 8px;font-weight:700;color:#fff}
.msg-content h1{font-size:1.3rem}
.msg-content h2{font-size:1.15rem}
.msg-content h3{font-size:1rem}

/* Search results box */
.search-box{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;margin:10px 0;
  max-height:280px;overflow-y:auto;
}
.search-box-head{
  display:flex;align-items:center;gap:8px;
  font-size:.78rem;color:var(--text-3);
  font-weight:700;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
}
.search-box-head i{color:var(--primary)}
.search-result{
  padding:10px;border-radius:var(--r-sm);
  margin-bottom:6px;cursor:pointer;
  transition:.2s;border:1px solid transparent;
}
.search-result:hover{
  background:var(--bg-3);border-color:var(--border-2);
}
.search-result a{
  color:var(--primary);font-weight:700;
  font-size:.85rem;text-decoration:none;
  display:block;margin-bottom:4px;
}
.search-result a:hover{text-decoration:underline}
.search-result .url{
  font-size:.7rem;color:var(--success);
  direction:ltr;text-align:left;
  margin-bottom:4px;font-family:monospace;
}
.search-result .snippet{
  font-size:.78rem;color:var(--text-2);line-height:1.7;
}
.search-result .source{
  display:inline-block;
  font-size:.65rem;padding:2px 8px;
  background:var(--bg-4);color:var(--text-3);
  border-radius:var(--r-full);margin-top:4px;
}
.search-result .source.ir{
  background:rgba(74,222,128,.15);
  color:var(--success);
}

/* Message actions */
.msg-actions{
  display:flex;gap:4px;margin-top:8px;
  opacity:0;transition:.2s;
}
.msg:hover .msg-actions{opacity:1}
.msg.user .msg-actions{justify-content:flex-end}
.msg-act{
  width:28px;height:28px;border-radius:6px;
  background:transparent;border:1px solid var(--border);
  color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;font-size:.72rem;
}
.msg-act:hover{background:var(--bg-2);border-color:var(--primary);color:var(--primary)}

/* Typing */
.typing{
  display:flex;align-items:center;gap:8px;
  padding:10px 0;color:var(--text-3);font-size:.82rem;
}
.typing-dots{display:flex;gap:4px}
.typing-dots span{
  width:6px;height:6px;border-radius:50%;
  background:var(--primary);animation:dot 1.4s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}

.stream-cursor{
  display:inline-block;width:2px;height:1.05em;
  background:var(--primary);margin-right:2px;
  vertical-align:middle;animation:cursor .8s infinite;
}

/* ============================================================
   📎 ATTACHMENT PREVIEW
   ============================================================ */
.attach-preview{
  display:none;padding:10px 16px 0;
  max-width:760px;margin:0 auto;width:100%;
}
.attach-preview.active{display:flex;gap:8px;flex-wrap:wrap}
.attach-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;background:var(--bg-3);
  border:1px solid var(--border-2);border-radius:var(--r-sm);
  font-size:.78rem;color:var(--text-2);
  position:relative;
}
.attach-item i{color:var(--primary)}
.attach-item .rm{
  background:transparent;border:none;color:var(--text-3);
  cursor:pointer;font-size:.75rem;padding:2px 4px;
  border-radius:4px;transition:.2s;
}
.attach-item .rm:hover{color:var(--danger);background:rgba(248,113,113,.1)}

/* ============================================================
   📥 INPUT AREA (بالاتر از کیبورد)
   ============================================================ */
.input-area{
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--bg);
  border-top:1px solid var(--border);
  position:relative;
}
.input-wrapper{max-width:760px;margin:0 auto}
.input-box{
  display:flex;align-items:flex-end;gap:6px;
  background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:var(--r-lg);padding:8px 8px 8px 12px;
  transition:.2s;
}
.input-box:focus-within{border-color:var(--primary)}
.chat-input{
  flex:1;background:transparent;border:none;color:var(--text);
  font-family:inherit;font-size:.92rem;outline:none;
  resize:none;max-height:160px;min-height:24px;
  padding:6px 0;line-height:1.6;
}
.chat-input::placeholder{color:var(--text-muted)}

.input-btn{
  width:36px;height:36px;border-radius:var(--r-sm);
  background:transparent;border:none;color:var(--text-3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s;font-size:.95rem;flex-shrink:0;
}
.input-btn:hover{background:var(--bg-3);color:var(--primary)}
.input-btn.send{
  background:var(--primary);color:#fff;
}
.input-btn.send:hover{background:var(--primary-hover)}
.input-btn.send:disabled{
  background:var(--bg-3);color:var(--text-muted);
  cursor:not-allowed;
}
.input-footer{
  max-width:760px;margin:6px auto 0;
  font-size:.68rem;color:var(--text-muted);text-align:center;
}

/* ============================================================
   🎭 MODAL / DIALOG
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  backdrop-filter:blur(4px);z-index:9999;
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.active{display:flex;animation:fadeIn .15s}
.modal{
  background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:var(--r-xl);padding:24px;
  max-width:400px;width:100%;animation:scaleIn .25s;
  box-shadow:var(--shadow-lg);
}
.modal h3{
  font-size:1.05rem;font-weight:800;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.modal h3 i{color:var(--primary)}
.modal p{color:var(--text-2);font-size:.85rem;line-height:1.8;margin-bottom:16px}
.modal-info{
  padding:12px;background:var(--bg-3);
  border-radius:var(--r-sm);margin-bottom:8px;
}
.modal-info .lbl{font-size:.68rem;color:var(--text-3);margin-bottom:3px}
.modal-info .val{
  font-weight:700;font-size:.85rem;
  direction:ltr;text-align:right;
}
.modal-actions{
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:18px;flex-wrap:wrap;
}
.modal-actions button{
  padding:9px 18px;border-radius:var(--r-sm);
  border:none;font-family:inherit;font-size:.83rem;
  font-weight:700;cursor:pointer;transition:.2s;
}
.btn-cancel{background:var(--bg-3);color:var(--text-2)}
.btn-cancel:hover{background:var(--bg-4);color:var(--text)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}

/* ============================================================
   💬 TOAST
   ============================================================ */
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  padding:11px 20px;background:var(--bg-2);
  border:1px solid var(--border-2);border-radius:var(--r);
  font-size:.82rem;font-weight:600;color:var(--text);
  z-index:99999;box-shadow:var(--shadow-lg);
  animation:fadeUp .3s;max-width:90%;
  display:flex;align-items:center;gap:8px;
}
.toast.error{border-color:rgba(248,113,113,.4);color:var(--danger)}
.toast.success{border-color:rgba(74,222,128,.4);color:var(--success)}

/* ============================================================
   📱 RESPONSIVE
   ============================================================ */
@media(max-width:768px){
  .sidebar{
    position:fixed;top:0;right:0;bottom:0;
    z-index:100;transform:translateX(100%);
    box-shadow:-4px 0 24px rgba(0,0,0,.5);width:280px;
  }
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .messages{padding:14px 12px 8px}
  .input-area{padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px))}
  .welcome h1{font-size:1.3rem}
  .welcome-icon{width:60px;height:60px;font-size:1.7rem}
  .suggestions{grid-template-columns:1fr}
  .msg-content{font-size:.88rem}

  .head-name{font-size:.85rem}

}

  .auth-title{font-size:1.4rem}
  .auth-logo-icon{width:64px;height:64px;font-size:1.9rem}

  .msg.user .msg-content{max-width:92%}
}

</head>
<body>

<!-- ============================================================
     SCREEN: AUTH
     ============================================================ -->
<div class="screen active" id="screen-auth">
  <div class="auth-screen">
    <div class="auth-container">
      <div class="auth-logo">
        <div class="auth-logo-icon">🤖</div>
        <h1 class="auth-title"><span class="hl">ALPHA</span>BOT</h1>
        <p class="auth-subtitle">دستیار هوشمند فارسی</p>
      </div>
      <div class="auth-msg" id="authMsg"></div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">ورود</button>
        <button class="auth-tab" data-tab="register">ثبت‌نام</button>
      </div>
      <form id="loginForm">
        <div class="auth-field">
          <label>ایمیل</label>
          <input class="auth-input" type="email" id="loginEmail" placeholder="example@email.com"/>
        </div>
        <div class="auth-field">

          <input class="auth-input" type="password" id="loginPass" placeholder="رمز عبور"/>
        </div>
        <button type="submit" class="auth-btn primary">
          <i class="fas fa-sign-in-alt"></i> ورود
        </button>
      </form>
      <form id="regForm" style="display:none">
        <div class="auth-field">
          <label>نام کامل</label>
          <input class="auth-input" type="text" id="regName" placeholder="نام و نام خانوادگی"/>
        </div>
        <div class="auth-field">
          <label>ایمیل</label>
          <input class="auth-input" type="email" id="regEmail" placeholder="example@email.com"/>
        </div>
        <div class="auth-field">
          <label>رمز عبور</label>
          <input class="auth-input" type="password" id="regPass" placeholder="حداقل ۶ کاراکتر"/>
        </div>
        <button type="submit" class="auth-btn primary">
          <i class="fas fa-user-plus"></i> ساخت حساب
        </button>

</div>

<!-- ============================================================
     SCREEN: CHAT
     ============================================================ -->
<div class="screen" id="screen-chat">
  <div class="chat-app">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:none"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-logo" onclick="newChat()">
          <div class="sb-logo-icon">🤖</div>
          <div class="sb-logo-text">
            <span class="alpha">ALPHA</span><span class="bot">BOT</span>
          </div>
        </div>
      </div>

      <button class="sb-new" onclick="newChat()">
        <i class="fas fa-plus"></i> گفتگوی جدید
      </button>

      <div class="sb-list" id="chatList">
        <div class="sb-label">گفتگوهای اخیر</div>
      </div>

      <div class="sb-footer">
        <button class="sb-user" onclick="openUserMenu()">
          <div class="sb-user-av" id="userAvatarEl">?</div>
          <div class="sb-user-info">
            <div class="sb-user-name" id="userNameEl">کاربر</div>
            <div class="sb-user-plan" id="userPlanEl">رایگان</div>
          </div>
          <i class="fas fa-chevron-left" style="color:var(--text-muted);font-size:.7rem"></i>
        </button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-head">
        <div class="chat-head-left">
          <button class="menu-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="head-title">
            <div class="head-icon">🤖</div>
            <div>
              <div class="head-name">
                <span class="alpha">ALPHA</span><span class="bot">BOT</span>
              </div>
              <div class="head-status">آنلاین</div>
            </div>
          </div>
        </div>
        <div class="head-actions">
          <button class="search-toggle" id="searchToggle" onclick="toggleWebSearch()">
            <i class="fas fa-globe"></i>
            <span>سرچ</span>
          </button>
          <button class="icon-btn" onclick="clearCurrentChat()" title="پاک کردن">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </header>

      <div class="messages" id="chatMessages">
        <div class="messages-inner" id="messagesInner"></div>
      </div>

      <div class="attach-preview" id="attachPreview"></div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-box">
            <button class="input-btn" onclick="document.getElementById('fileInput').click()" title="افزودن فایل">
              <i class="fas fa-paperclip"></i>
            </button>
            <input type="file" id="fileInput" accept=".txt,.md,.json,.csv,image/*" style="display:none" onchange="handleFileSelect(this)" multiple/>
            <textarea class="chat-input" id="chatInput" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
            <button class="input-btn send" onclick="sendMessage()" id="sendBtn" disabled>
              <i class="fas fa-arrow-up"></i>
            </button>
          </div>
        </div>
        <div class="input-footer">
          AlphaBot ممکن است اشتباه کند. لطفاً اطلاعات مهم را بررسی کنید.
        </div>
      </div>
    </main>

  </div>
</div>

<!-- ============================================================
     MODAL: User
     ============================================================ -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <h3><i class="fas fa-user-circle"></i> حساب کاربری</h3>
    <div class="modal-info">
      <div class="lbl">ایمیل</div>
      <div class="val" id="modalEmail">-</div>
    </div>
    <div class="modal-info">
      <div class="lbl">تعداد گفتگوها</div>
      <div class="val" id="modalChats">0</div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeUserMenu()">بستن</button>
      <button class="btn-danger" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> خروج
      </button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ⚙️ API CONFIG - AvalAI
// ============================================================
const API_BASE = 'https://api.avalai.ir/v1';
const API_KEY = 'aa-RITbplO8bQoxXVBpah52tS5RYZfzxMAoAbBB27gz2ihN2cPd';
const API_MODEL = 'gpt-4o-mini';

// ============================================================
// Storage
// ============================================================
const OWNER_EMAIL = 'tahadaneshbayan2@gmail.com';
const SK = 'alphabot_session';
const UK = 'alphabot_users';
const CK = 'alphabot_chats';
const MK = 'alphabot_messages';

let currentUser = null;
let currentChatId = null;
let chats = [];
let messages = [];
let isStreaming = false;
let currentAbortController = null;
let webSearchEnabled = false;
let pendingFiles = [];

// ============================================================
// Helpers
// ============================================================
function gs(k, d=[]){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function ss(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}

function toast(m, type=''){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = m;
  document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(), 300)}, 2800);
}

function authMsg(m, t='error'){
  const b = document.getElementById('authMsg');
  b.textContent = m;
  b.className = 'auth-msg ' + t;
  b.style.display = 'block';
  setTimeout(()=>b.style.display='none', 5000);
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function scrollToBottom(smooth=false){
  const c = document.getElementById('chatMessages');
  if(c) c.scrollTo({top: c.scrollHeight, behavior: smooth?'smooth':'auto'});
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const s = document.getElementById('screen-'+name);
  if(s) s.classList.add('active');
}

// ============================================================
// Load all data
// ============================================================
function loadAll(){
  chats = gs(CK, []);
  messages = gs(MK, []);
  const users = gs(UK, []);
  let updated = false;
  users.forEach(u=>{
    if(u.email.toLowerCase() === OWNER_EMAIL.toLowerCase() && (!u.is_admin || u.role !== 'owner')){
      u.is_admin = true; u.role = 'owner'; updated = true;
    }
  });
  if(updated) ss(UK, users);
  const s = gs(SK, null);
  if(s){
    if(s.email && s.email.toLowerCase() === OWNER_EMAIL.toLowerCase()){
      s.is_admin = true; s.role = 'owner'; ss(SK, s);
    }
    currentUser = s;
  }
}

// ============================================================
// AUTH
// ============================================================
document.querySelectorAll('.auth-tab').forEach(tab=>{
  tab.addEventListener('click', function(){
    const t = this.dataset.tab;
    document.querySelectorAll('.auth-tab').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('loginForm').style.display = t==='login'?'block':'none';
    document.getElementById('regForm').style.display = t==='register'?'block':'none';
    document.getElementById('authMsg').style.display = 'none';
  });
});

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const em = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pw = document.getElementById('loginPass').value;
  if(!em || !pw){authMsg('ایمیل و رمز رو پر کن'); return}
  let u = gs(UK, []);
  if(em === OWNER_EMAIL.toLowerCase()){
    let o = u.find(x=>x.email.toLowerCase() === em);
    if(o){if(o.password !== pw){authMsg('رمز اشتباه');return}}
    else{o = {id:Date.now(), email:em, password:pw, full_name:'مالک AlphaBot', role:'owner', is_admin:true, created_at:new Date().toISOString()};u.push(o)}
    o.role = 'owner'; o.is_admin = true;
    ss(UK, u);
    currentUser = {user_id:o.id, email:o.email, full_name:o.full_name, role:'owner', is_admin:true};
    ss(SK, currentUser);
    authMsg('👑 خوش آمدید مالک!','success');
    setTimeout(startApp, 500);
    return;
  }
  const x = u.find(y=>y.email.toLowerCase() === em);
  if(!x){authMsg('کاربر پیدا نشد');return}
  if(x.password !== pw){authMsg('رمز اشتباه');return}
  currentUser = {user_id:x.id, email:x.email, full_name:x.full_name, role:x.role||'user', is_admin:x.is_admin||false};
  ss(SK, currentUser);
  authMsg('✅ ورود موفق','success');
  setTimeout(startApp, 500);
});

document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const n = document.getElementById('regName').value.trim();
  const em = document.getElementById('regEmail').value.trim().toLowerCase();
  const pw = document.getElementById('regPass').value;
  if(!n){authMsg('نام رو بزن');return}
  if(!em || !em.includes('@')){authMsg('ایمیل معتبر');return}
  if(pw.length < 6){authMsg('رمز حداقل ۶ کاراکتر');return}
  let u = gs(UK, []);
  if(u.find(x=>x.email.toLowerCase() === em)){authMsg('این ایمیل ثبت شده');return}
  const io = em === OWNER_EMAIL.toLowerCase();
  const nu = {id:Date.now(), email:em, password:pw, full_name:n, role:io?'owner':'user', is_admin:io, created_at:new Date().toISOString()};
  u.push(nu); ss(UK, u);
  currentUser = {user_id:nu.id, email:nu.email, full_name:nu.full_name, role:nu.role, is_admin:nu.is_admin};
  ss(SK, currentUser);
  authMsg(io?'👑 ثبت‌نام مالک!':'✅ ثبت‌نام موفق','success');
  setTimeout(startApp, 500);
});

function guestLogin(){
  currentUser = {user_id:Date.now(), email:'guest@alphabot.local', full_name:'کاربر مهمان', role:'user', is_admin:false};
  ss(SK, currentUser);
  startApp();
}

function logout(){
  if(!confirm('خارج می‌شی؟')) return;
  localStorage.removeItem(SK);
  currentUser = null;
  currentChatId = null;
  showScreen('auth');
  toast('خارج شدید');
}

function startApp(){
  showScreen('chat');
  updateUserUI();
  loadChats();
  const userChats = chats.filter(c=>c.user_id === currentUser.user_id);
  if(userChats.length === 0){newChat();}
  else{
    const lastChat = userChats.sort((a,b)=>b.updated_at - a.updated_at)[0];
    openChat(lastChat.id);
  }
}

function updateUserUI(){
  if(!currentUser) return;
  const initials = (currentUser.full_name || currentUser.email).charAt(0).toUpperCase();
  document.getElementById('userAvatarEl').textContent = initials;
  document.getElementById('userNameEl').textContent = currentUser.full_name || 'کاربر';
  let plan = 'رایگان';
  if(currentUser.role === 'owner') plan = '👑 مالک';
  else if(currentUser.is_admin) plan = '⭐ ادمین';
  document.getElementById('userPlanEl').textContent = plan;
}

// ============================================================
// CHATS
// ============================================================
function newChat(){
  const id = Date.now().toString();
  const chat = {id, user_id:currentUser.user_id, title:'گفتگوی جدید', created_at:Date.now(), updated_at:Date.now()};
  chats.push(chat);
  ss(CK, chats);
  currentChatId = id;
  loadChats();
  renderMessages();
  closeSidebar();
  setTimeout(()=>document.getElementById('chatInput')?.focus(), 100);
}

function loadChats(){
  const list = document.getElementById('chatList');
  const userChats = chats.filter(c=>c.user_id === currentUser.user_id).sort((a,b)=>b.updated_at - a.updated_at);
  if(userChats.length === 0){
    list.innerHTML = '<div class="sb-label">گفتگوهای اخیر</div><div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.78rem;">هنوز گفتگویی نداری</div>';
    return;
  }
  list.innerHTML = '<div class="sb-label">گفتگوهای اخیر</div>' +
    userChats.map(c=>`
      <div class="sb-item ${c.id === currentChatId ? 'active' : ''}" onclick="openChat('${c.id}')">
        <i class="fas fa-message"></i>
        <span class="sb-item-text">${escapeHtml(c.title)}</span>
        <button class="del" onclick="event.stopPropagation();deleteChat('${c.id}')">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    `).join('');
}

function openChat(id){
  currentChatId = id;
  loadChats();
  renderMessages();
  closeSidebar();
}

function deleteChat(id){
  if(!confirm('این گفتگو حذف بشه؟')) return;
  chats = chats.filter(c=>c.id !== id);
  messages = messages.filter(m=>m.chat_id !== id);
  ss(CK, chats);
  ss(MK, messages);
  if(currentChatId === id){
    const userChats = chats.filter(c=>c.user_id === currentUser.user_id);
    if(userChats.length > 0) openChat(userChats[0].id);
    else newChat();
  } else loadChats();
  toast('🗑️ حذف شد');
}

function clearCurrentChat(){
  if(!currentChatId) return;
  if(!confirm('پیام‌های این گفتگو پاک بشه؟')) return;
  messages = messages.filter(m=>m.chat_id !== currentChatId);
  ss(MK, messages);
  renderMessages();
  toast('🧹 پاک شد');
}

// ============================================================
// RENDER MESSAGES
// ============================================================
function renderMessages(){
  const inner = document.getElementById('messagesInner');
  const chatMsgs = messages.filter(m=>m.chat_id === currentChatId);
  if(chatMsgs.length === 0){inner.innerHTML = renderWelcome(); return}
  inner.innerHTML = chatMsgs.map(m=>renderMessage(m)).join('');
  setTimeout(()=>scrollToBottom(), 30);
}

function renderWelcome(){
  return `<div class="welcome">
    <div class="welcome-icon">🤖</div>
    <h1>سلام، من <span>AlphaBot</span> هستم</h1>
    <p>چطور می‌تونم امروز کمکت کنم؟ می‌تونی سوال بپرسی، فایل بفرستی، یا از پیشنهادهای زیر استفاده کنی.</p>
    <div class="suggestions">

// ============================================================
// FORMAT CONTENT (با کد بلاک + دکمه کپی/دانلود)
// ============================================================
function formatContent(text){
  let html = escapeHtml(text || '');

  // Code blocks با دکمه کپی و دانلود
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
    const langName = (lang || 'text').toLowerCase();
    const cleanCode = code.trim();
    const codeId = 'code_' + Math.random().toString(36).substr(2, 9);
    const dlName = 'code.' + getExtension(langName);
    return `<div class="code-block">
      <div class="code-head">
        <span class="code-lang">${langName}</span>
        <div class="code-actions">
          <button class="code-act" onclick="copyCode(this)" data-code="${escapeHtml(cleanCode).replace(/"/g,'&quot;')}">
            <i class="fas fa-copy"></i> کپی
          </button>
          <button class="code-act" onclick="downloadCode(this)" data-code="${escapeHtml(cleanCode).replace(/"/g,'&quot;')}" data-name="${dlName}">
            <i class="fas fa-download"></i> دانلود
          </button>
        </div>
      </div>
      <div class="code-content" id="${codeId}">${escapeHtml(cleanCode)}</div>
    </div>`;
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headers
  html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Links
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Line breaks
  html = html.replace(/\n/g, '<br>');

  return html;
}

function getExtension(lang){
  const map = {
    'python': 'py', 'py': 'py',
    'javascript': 'js', 'js': 'js',
    'html': 'html', 'css': 'css',
    'json': 'json', 'typescript': 'ts',
    'java': 'java', 'cpp': 'cpp', 'c': 'c',
    'bash': 'sh', 'shell': 'sh',
    'php': 'php', 'ruby': 'rb', 'go': 'go',
    'rust': 'rs', 'sql': 'sql', 'xml': 'xml',
    'yaml': 'yaml', 'markdown': 'md', 'md': 'md'
  };
  return map[lang] || 'txt';
}

function copyCode(btn){
  const code = btn.dataset.code;
  navigator.clipboard.writeText(code).then(()=>toast('✅ کد کپی شد','success'));
}

function downloadCode(btn){
  const code = btn.dataset.code;
  const name = btn.dataset.name;
  const blob = new Blob([code], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
  toast('📥 دانلود شد','success');
}

function copyMsg(id){
  const m = messages.find(x=>x.id === id);
  if(!m) return;
  navigator.clipboard.writeText(m.content).then(()=>toast('✅ کپی شد','success'));

async function handleFileSelect(input){
  const files = Array.from(input.files);
  if(!files.length) return;
  for(const file of files){
    if(file.size > 5 * 1024 * 1024){toast('فایل حداکثر ۵MB','error');continue}
    pendingFiles.push(file);
  }
  input.value = '';
  renderAttachPreview();
}

function renderAttachPreview(){
  const preview = document.getElementById('attachPreview');
  if(pendingFiles.length === 0){preview.classList.remove('active'); preview.innerHTML = ''; return}
  preview.classList.add('active');
  preview.innerHTML = pendingFiles.map((f, i)=>`
    <div class="attach-item">
      <i class="fas ${f.type.startsWith('image/')?'fa-image':'fa-file-lines'}"></i>
      <span>${escapeHtml(f.name)}</span>
      <button class="rm" onclick="removePendingFile(${i})"><i class="fas fa-times"></i></button>
    </div>
  `).join('');
}

function removePendingFile(i){
  pendingFiles.splice(i, 1);
  renderAttachPreview();
}

async function processFiles(){
  const results = [];
  for(const file of pendingFiles){
    const result = {name: file.name, type: file.type, content: null, isImage: false};
    if(file.type.startsWith('image/')){
      result.isImage = true;
      result.content = await fileToDataURL(file);
    } else {
      result.content = await fileToText(file);
    }
    results.push(result);
  }
  return results;
}

function fileToDataURL(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function fileToText(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.readAsText(file, 'UTF-8');
  });
}

// استخراج کوئری واقعی از پیام کاربر
function extractSearchQuery(text){
  let q = text;

  // حذف دستورات سرچ از پیام
  const patterns = [
    /توی گوگل بزن\s*[:"]?\s*/gi,
    /در گوگل بزن\s*[:"]?\s*/gi,
    /گوگل کن\s*[:"]?\s*/gi,
    /سرچ کن\s*[:"]?\s*/gi,
    /جستجو کن\s*[:"]?\s*/gi,
    /search\s+(for\s+)?/gi,
    /google\s+/gi,
    /اینو\s+سرچ\s+کن\s*[:"]?\s*/gi,
    /درباره\s+/gi,
    /راجع به\s+/gi
  ];

  for(const p of patterns){
    q = q.replace(p, '');
  }

  return q.trim() || text;
}

// تشخیص سایت ایرانی
function isIranianUrl(url){
  const iranianDomains = [
    'ir', 'irna.ir', 'mehrnews.com', 'isna.ir', 'tasnimnews.com',
    'farsnews.ir', 'yjc.ir', 'khabaronline.ir', 'tabnak.ir',
    'varzesh3.com', 'zoomit.ir', 'digiato.com', 'khabar.com',
    'aparat.com', 'youtube.com/c', 'virgool.io', 'blog.ir',
    'parsine.com', 'asriran.com', 'shabnamnews.com', 'entekhab.ir',
    'donya-e-eqtesad.com', 'hamshahrionline.ir', 'irdc.ir',
    'tiktok.com', 'divar.ir', 'sheypoor.com', 'bama.ir',
    'cafebazaar.ir', 'myket.ir', 'sibapp.com', 'charkhoneh.com',
    'wikipedia.org/fa', 'fa.wikipedia.org'
  ];
  try {
    const host = new URL(url).hostname.toLowerCase();
    if(host.endsWith('.ir')) return true;
    return iranianUrls.some(d => host.includes(d));
  } catch { return false }
}

// جستجوی وب واقعی (از طریق API DuckDuckGo که CORS نداره)
async function searchWeb(query){
  const cleanQuery = extractSearchQuery(query);
  if(!cleanQuery) return [];

  try {
    // استفاده از DuckDuckGo Instant Answer API
    const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery)}&format=json&no_html=1&skip_disambig=1`;
    const res = await fetch(ddgUrl);
    const data = await res.json();

    const results = [];

    // Abstract
    if(data.AbstractText){
      results.push({
        title: data.Heading || cleanQuery,
        url: data.AbstractURL || '',
        snippet: data.AbstractText,
        source: 'DuckDuckGo',
        isIranian: isIranianUrl(data.AbstractURL || '')
      });
    }

    // Related Topics
    if(data.RelatedTopics){
      for(const t of data.RelatedTopics.slice(0, 6)){
        if(t.Text && t.FirstURL){
          results.push({
            title: t.Text.slice(0, 60),
            url: t.FirstURL,
            snippet: t.Text,
            source: 'DuckDuckGo',
            isIranian: isIranianUrl(t.FirstURL)
          });
        }
      }
    }

    return results.slice(0, 6);
  } catch(e){
    console.error('Search error:', e);
    return [];
  }
}

قوانین مهم:

- اگه تصویری ضمیمه شد، متن داخلش رو استخراج کن`;

    // پیام‌های قبلی
    const prevMsgs = messages.filter(m=>m.chat_id === currentChatId && m.id !== aiMsgId).slice(-10);
    prevMsgs.forEach(m => {
      let content = m.content;

      if(m.files && m.files.length > 0){

        if(fileText) content += fileText;
      }

      if(m.role === 'user'){
        apiMessages.push({role:'user', content});
        // اگه تصویر داشت، به فرمت multimodal
        const images = (m.files || []).filter(f=>f.isImage);
        if(images.length > 0){
          const lastIdx = apiMessages.length - 1;
          apiMessages[lastIdx] = {
            role: 'user',
            content: [
              {type: 'text', text: content},
              ...images.map(img=>({type: 'image_url', image_url: {url: img.content}}))
            ]
          };
        }
      } else {
        apiMessages.push({role:'assistant', content});
      }
    });

    // درخواست به API
    const response = await fetch(`${API_BASE}/chat/completions`, {
      method: 'POST',
      headers: {

        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({

        messages: apiMessages,
        temperature: 0.7,
        max_tokens: 2500,
        stream: true
      }),
      signal: currentAbortController.signal
    });

    if(!response.ok){
      const errText = await response.text();
      console.error('API Error:', response.status, errText);
      throw new Error(`HTTP ${response.status}`);
    }

    document.getElementById(typingId)?.remove();

    // ساخت پیام AI
    let aiHtml = '';

      aiHtml += `<div class="search-box">

          </div>
        `).join('')}

    inner.insertAdjacentHTML('beforeend', `
      <div class="msg ai" id="msg-${aiMsgId}">
        <div class="msg-avatar">🤖</div>
        <div class="msg-body">
          <div class="msg-name">AlphaBot</div>
          ${aiHtml}
          <div class="msg-content" id="content-${aiMsgId}"><span class="stream-cursor"></span></div>
          <div class="msg-actions">
            <button class="msg-act" onclick="copyMsg('${aiMsgId}')"><i class="fas fa-copy"></i></button>
            <button class="msg-act" onclick="regenerate()"><i class="fas fa-redo"></i></button>
          </div>
        </div>
      </div>
    `);
    scrollToBottom(true);

    // Stream خواندن
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    let displayedText = '';
    let displayQueue = '';

    // انیمیشن تایپ نرم
    const typeInterval = setInterval(()=>{
      if(displayQueue.length > 0){
        const chunkSize = Math.min(3, displayQueue.length);
        displayedText += displayQueue.slice(0, chunkSize);
        displayQueue = displayQueue.slice(chunkSize);
        const contentEl = document.getElementById('content-' + aiMsgId);
        if(contentEl){
          contentEl.innerHTML = formatContent(displayedText) + '<span class="stream-cursor"></span>';
          scrollToBottom();
        }
      }
    }, 25);

    while(true){
      const {done, value} = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for(const line of lines){
        if(!line.trim() || !line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if(data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if(delta){
            fullText += delta;
            displayQueue += delta;
          }
        } catch(e){}
      }
    }

    // صبر کن تا انیمیشن تایپ تموم شه
    await new Promise(resolve=>{
      const check = setInterval(()=>{
        if(displayQueue.length === 0){
          clearInterval(check);
          clearInterval(typeInterval);
          resolve();
        }
      }, 50);
      setTimeout(()=>{clearInterval(check); clearInterval(typeInterval); resolve()}, 15000);
    });

    // رندر نهایی
    const contentEl = document.getElementById('content-' + aiMsgId);
    if(contentEl){
      contentEl.innerHTML = formatContent(fullText);
    }

    if(fullText.trim()){
      aiMsg.content = fullText.trim();
      messages.push(aiMsg);
      ss(MK, messages);
    } else {
      document.getElementById('msg-' + aiMsgId)?.remove();
      toast('پاسخی دریافت نشد','error');
    }

    if(chat) chat.updated_at = Date.now();
    ss(CK, chats);
    loadChats();

  } catch(err){
    console.error('Stream error:', err);
    document.getElementById(typingId)?.remove();
    document.getElementById('msg-' + aiMsgId)?.remove();

    if(err.name === 'AbortError'){
      toast('لغو شد');
    } else {
      toast('❌ ' + err.message, 'error');
    }
  }

  isStreaming = false;
  chatInput.focus();
}

// ============================================================
// REGENERATE
// ============================================================
function regenerate(){
  if(isStreaming) return;
  const chatMsgs = messages.filter(m=>m.chat_id === currentChatId);
  const lastAi = [...chatMsgs].reverse().find(m=>m.role === 'ai');
  const lastUser = [...chatMsgs].reverse().find(m=>m.role === 'user');
  if(!lastAi || !lastUser) return;
  messages = messages.filter(m=>m.id !== lastAi.id);
  ss(MK, messages);
  renderMessages();
  chatInput.value = lastUser.content;
  sendMessage();
}

// ============================================================
// SIDEBAR
// ============================================================
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  const ov = document.getElementById('sidebarOverlay');
  ov.classList.toggle('open');
  ov.style.display = ov.classList.contains('open') ? 'block' : 'none';
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  const ov = document.getElementById('sidebarOverlay');
  ov.classList.remove('open');
  ov.style.display = 'none';
}

// ============================================================
// USER MENU
// ============================================================
function openUserMenu(){
  if(!currentUser) return;
  const userChats = chats.filter(c=>c.user_id === currentUser.user_id);
  document.getElementById('modalEmail').textContent = currentUser.email;
  document.getElementById('modalChats').textContent = userChats.length + ' گفتگو';
  document.getElementById('userModal').classList.add('active');
}
function closeUserMenu(){
  document.getElementById('userModal').classList.remove('active');
}
document.getElementById('userModal').addEventListener('click', function(e){
  if(e.target === this) closeUserMenu();
});

// ============================================================
// KEYBOARD HANDLING - Input بالاتر از کیبورد
// ============================================================
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    const area = document.querySelector('.input-area');
    if(!area) return;
    const diff = window.innerHeight - window.visualViewport.height;
    if(diff > 100){
      area.style.transform = `translateY(-${Math.max(0, diff - 40)}px)`;
    } else {
      area.style.transform = 'translateY(0)';
    }
  });
}

// ============================================================
// INIT
// ============================================================
function init(){
  loadAll();
  if(currentUser){startApp();}
  else{showScreen('auth');}
}
init();
</script>
