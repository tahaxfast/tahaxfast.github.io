<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0d0d0d"/>
<title>AlphaBot | هوش مصنوعی فارسی هوشمند</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- KaTeX برای فرمول ریاضی -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<!-- jsPDF برای دانلود PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>"/>

<style>
/* ═══════════════════════════════════════════════════════════
   🎨 Theme - DeepSeek Style
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg: #0d0d0d; --bg-2: #171717; --bg-3: #1f1f1f; --bg-4: #262626;
  --bg-hover: #2a2a2a; --bg-sidebar: #0a0a0a;
  --bg-sidebar-hover: #171717; --bg-sidebar-active: #1f1f1f;
  --bg-chat: #0d0d0d;

  --text: #ececec; --text-2: #b8b8b8; --text-3: #7a7a7a; --text-muted: #5a5a5a;

  --primary: #4d9cf7; --primary-hover: #3b82e0;
  --primary-soft: rgba(77,156,247,.12);
  --primary-glow: rgba(77,156,247,.35);

  --success: #4ade80; --danger: #f87171; --warning: #fbbf24;

  --border: #1f1f1f; --border-2: #2a2a2a; --border-3: #3a3a3a;
  --user-bubble: #2a2a2a;
  --code-bg: #1a1a1a; --code-border: #2a2a2a;

  --r-sm: 8px; --r: 12px; --r-lg: 18px; --r-xl: 24px; --r-full: 9999px;

  --shadow: 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
  --ease: cubic-bezier(.4,0,.2,1);
  --bounce: cubic-bezier(.34,1.56,.64,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.7; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-3)}
::selection{background:var(--primary);color:#fff}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes cursor{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--primary-glow)}50%{box-shadow:0 0 20px var(--primary-glow)}}
@keyframes soundWave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.5)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Screens */
.screen{display:none;width:100%;height:100vh;position:relative}
.screen.active{display:flex;animation:fadeIn .3s}

/* ═══ AUTH ═══ */
.auth-screen{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100vh;background:var(--bg);
  padding:20px;position:relative;overflow:hidden;
}
.auth-screen::before{
  content:'';position:absolute;top:-30%;right:-15%;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(77,156,247,.12),transparent 70%);
  border-radius:50%;animation:pulse 8s infinite;
}
.auth-screen::after{
  content:'';position:absolute;bottom:-30%;left:-15%;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(77,156,247,.08),transparent 70%);
  border-radius:50%;animation:pulse 10s infinite reverse;
}
.auth-container{width:100%;max-width:400px;position:relative;z-index:1;animation:scaleIn .4s}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo-icon{
  width:76px;height:76px;margin:0 auto 18px;
  border-radius:20px;background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;color:#fff;
  box-shadow:0 0 40px var(--primary-glow);
}
.auth-title{font-size:1.6rem;font-weight:900;letter-spacing:-.5px;margin-bottom:8px}
.auth-title .hl{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.auth-subtitle{color:var(--text-3);font-size:.85rem}
.auth-tabs{
  display:flex;gap:4px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r);
  padding:4px;margin-bottom:22px;
}
.auth-tab{
  flex:1;padding:10px;border:none;background:transparent;
  color:var(--text-2);font-family:inherit;font-size:.85rem;
  font-weight:700;cursor:pointer;border-radius:8px;transition:.2s;
}
.auth-tab.active{background:var(--bg-3);color:var(--primary)}
.auth-field{margin-bottom:14px}
.auth-field label{
  display:block;font-size:.8rem;color:var(--text-2);
  font-weight:600;margin-bottom:6px;
}
.auth-input{
  width:100%;padding:12px 16px;background:var(--bg-2);
  border:1px solid var(--border-2);border-radius:var(--r);
  color:var(--text);font-family:inherit;font-size:.9rem;
  outline:none;transition:.2s;
}
.auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.auth-input::placeholder{color:var(--text-muted)}
.auth-msg{
  padding:11px 14px;border-radius:var(--r);font-size:.82rem;
  font-weight:600;margin-bottom:14px;display:none;
}
.auth-msg.error{display:block;background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}
.auth-msg.success{display:block;background:rgba(74,222,128,.1);color:var(--success);border:1px solid rgba(74,222,128,.2)}
.auth-btn{
  width:100%;padding:13px;border:none;border-radius:var(--r);
  font-family:inherit;font-size:.92rem;font-weight:800;
  cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.auth-btn.primary{background:var(--primary);color:#fff}
.auth-btn.primary:hover{background:var(--primary-hover)}
.auth-btn.secondary{background:var(--bg-2);color:var(--text);border:1px solid var(--border-2)}
.auth-btn.secondary:hover{background:var(--bg-3)}

/* ═══ CHAT APP ═══ */
.chat-app{display:flex;width:100%;height:100vh;background:var(--bg)}

/* Sidebar */
.sidebar{
  width:260px;background:var(--bg-sidebar);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .3s var(--ease);
  flex-shrink:0;position:relative;z-index:100;
}
.sb-header{padding:10px;display:flex;align-items:center;gap:6px}
.sb-logo{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;transition:.2s;flex:1;
}
.sb-logo:hover{background:var(--bg-sidebar-hover)}
.sb-logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:.95rem;color:#fff;flex-shrink:0;
}
.sb-logo-text{font-size:.95rem;font-weight:800;letter-spacing:-.3px}
.sb-logo-text .alpha{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.sb-logo-text .bot{color:var(--text)}
.sb-new{
  margin:4px 10px 10px;padding:10px 14px;
  background:transparent;border:1px solid var(--border-2);
  border-radius:var(--r);color:var(--text);font-family:inherit;
  font-size:.85rem;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:.2s;
}
.sb-new:hover{background:var(--bg-sidebar-hover);border-color:var(--primary)}
.sb-new i{color:var(--primary);font-size:.8rem}
.sb-list{flex:1;overflow-y:auto;padding:4px 8px}
.sb-label{
  font-size:.65rem;color:var(--text-muted);font-weight:700;
  letter-spacing:1.5px;padding:12px 10px 6px;text-transform:uppercase;
}
.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;border-radius:var(--r-sm);
  cursor:pointer;transition:.2s;color:var(--text-2);
  font-size:.85rem;position:relative;margin-bottom:1px;
}
.sb-item:hover{background:var(--bg-sidebar-hover);color:var(--text)}
.sb-item.active{background:var(--bg-sidebar-active);color:var(--text)}
.sb-item i{font-size:.8rem;color:var(--text-3);flex-shrink:0}
.sb-item.active i,.sb-item:hover i{color:var(--primary)}
.sb-item-text{
  flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.sb-item .del{
  opacity:0;background:transparent;border:none;
  color:var(--text-3);cursor:pointer;padding:3px;
  border-radius:5px;transition:.2s;font-size:.7rem;
}
.sb-item:hover .del{opacity:1}
.sb-item .del:hover{color:var(--danger);background:rgba(248,113,113,.1)}
.sb-footer{padding:8px 10px;border-top:1px solid var(--border)}
.sb-user{
  width:100%;padding:8px 10px;background:transparent;border:none;
  border-radius:var(--r-sm);display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:.2s;font-family:inherit;color:var(--text);
  text-align:right;
}
.sb-user:hover{background:var(--bg-sidebar-hover)}
.sb-user-av{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:800;color:#fff;flex-shrink:0;
}
.sb-user-info{flex:1;min-width:0;text-align:right}
.sb-user-name{
  font-size:.83rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sb-user-plan{font-size:.68rem;color:var(--text-muted)}

/* Main */
.chat-main{
  flex:1;display:flex;flex-direction:column;
  background:var(--bg-chat);min-width:0;position:relative;
}
.chat-head{
  padding:10px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:var(--bg);z-index:10;min-height:56px;
}
.chat-head-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.menu-btn{
  display:none;width:36px;height:36px;border-radius:var(--r-sm);
  background:transparent;border:none;color:var(--text-2);
  cursor:pointer;align-items:center;justify-content:center;
  transition:.2s;font-size:.95rem;
}
.menu-btn:hover{background:var(--bg-2);color:var(--text)}
.head-title{display:flex;align-items:center;gap:8px}
.head-icon{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:#fff;
}
.head-name{font-size:.92rem;font-weight:800;letter-spacing:-.3px}
.head-name .alpha{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.head-name .bot{color:var(--text)}
.head-status{
  font-size:.68rem;color:var(--success);
  display:flex;align-items:center;gap:4px;font-weight:600;
}
.head-status::before{
  content:'';width:5px;height:5px;
  background:var(--success);border-radius:50%;
}
.head-actions{display:flex;gap:4px;align-items:center}

.search-toggle,.pdf-toggle{
  display:flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:var(--r-full);
  background:transparent;border:1px solid var(--border-2);
  color:var(--text-2);font-family:inherit;font-size:.78rem;
  font-weight:600;cursor:pointer;transition:.2s;
}
.search-toggle:hover,.pdf-toggle:hover{background:var(--bg-2);color:var(--text)}
.search-toggle.active{
  background:var(--primary-soft);
  border-color:var(--primary);
  color:var(--primary);
}
.pdf-toggle{color:var(--success);border-color:rgba(74,222,128,.3)}
.pdf-toggle:hover{background:rgba(74,222,128,.1);border-color:var(--success)}
.search-toggle i,.pdf-toggle i{font-size:.75rem}

.icon-btn{
  width:36px;height:36px;border-radius:var(--r-sm);
  background:transparent;border:none;color:var(--text-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s;font-size:.95rem;
}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}

/* Messages */
.messages{
  flex:1;overflow-y:auto;padding:20px 16px 12px;
  scroll-behavior:smooth;
}
.messages-inner{max-width:760px;margin:0 auto;padding-bottom:20px}

.welcome{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
  min-height:calc(100vh - 320px);padding:20px;
  animation:fadeIn .4s;
}
.welcome-icon{
  width:68px;height:68px;border-radius:18px;
  background:linear-gradient(135deg,#4d9cf7,#3b82e0);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:#fff;margin-bottom:20px;
  box-shadow:0 0 40px var(--primary-glow);
  animation:pulse 3s infinite;
}
.welcome h1{
  font-size:1.5rem;font-weight:800;
  margin-bottom:10px;letter-spacing:-.5px;
}
.welcome h1 span{
  background:linear-gradient(135deg,#4d9cf7,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.welcome p{
  font-size:.9rem;color:var(--text-2);
  margin-bottom:28px;max-width:460px;line-height:1.9;
}
.suggestions{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;max-width:580px;width:100%;
}
.suggestion{
  padding:14px 16px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r);
  cursor:pointer;transition:.3s var(--bounce);
  text-align:right;font-size:.83rem;color:var(--text-2);
  display:flex;align-items:flex-start;gap:10px;
}
.suggestion:hover{
  background:var(--bg-3);border-color:var(--primary);
  color:var(--text);transform:translateY(-3px);
}
.suggestion i{color:var(--primary);font-size:.9rem;flex-shrink:0;margin-top:2px}

/* Message bubbles */
.msg{
  margin-bottom:20px;animation:fadeUp .3s;
  display:flex;gap:12px;
}
.msg.user{flex-direction:row-reverse}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:800;
}
.msg.user .msg-avatar{background:linear-gradient(135deg,#4d9cf7,#3b82e0);color:#fff}
.msg.ai .msg-avatar{background:linear-gradient(135deg,#3b82e0,#4d9cf7);color:#fff}
.msg-body{flex:1;min-width:0;max-width:100%}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.msg-name{
  font-size:.72rem;color:var(--text-3);
  font-weight:600;margin-bottom:4px;
}
.msg-content{
  font-size:.92rem;line-height:1.9;color:var(--text);
  word-wrap:break-word;overflow-wrap:break-word;
}
.msg.user .msg-content{
  background:var(--user-bubble);padding:11px 16px;
  border-radius:16px;border-top-right-radius:4px;
  max-width:88%;display:inline-block;white-space:pre-wrap;
}
.msg.ai .msg-content{padding:2px 0;max-width:100%}

/* ═══ CODE BLOCK ═══ */
.code-block{
  position:relative;background:var(--code-bg);
  border:1px solid var(--code-border);border-radius:var(--r);
  margin:12px 0;overflow:hidden;direction:ltr;
}
.code-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--code-border);
}
.code-lang{
  font-size:.7rem;color:var(--text-3);
  font-weight:700;text-transform:uppercase;letter-spacing:1px;
  font-family:'Consolas','Monaco',monospace;
}
.code-actions{display:flex;gap:4px}
.code-act{
  background:transparent;border:none;color:var(--text-3);
  cursor:pointer;padding:5px 8px;border-radius:6px;
  font-size:.7rem;font-family:inherit;font-weight:600;
  display:flex;align-items:center;gap:4px;transition:.2s;
}
.code-act:hover{background:var(--bg-3);color:var(--text)}
.code-act i{font-size:.7rem}
.code-content{
  padding:14px;overflow-x:auto;
  font-family:'Consolas','Monaco',monospace;
  font-size:.84rem;line-height:1.6;color:#e0e0e0;
  white-space:pre;
}
.msg-content code{
  background:var(--code-bg);border:1px solid var(--code-border);
  padding:2px 6px;border-radius:4px;
  font-family:'Consolas','Monaco',monospace;
  font-size:.84rem;direction:ltr;display:inline-block;
  color:#60a5fa;
}
.msg-content strong{color:#fff;font-weight:700}
.msg-content a{color:var(--primary);text-decoration:underline}
.msg-content ul,
.msg-content ol{padding-right:20px;margin:8px 0}
.msg-content li{margin-bottom:4px}
.msg-content h1,
.msg-content h2,
.msg-content h3{margin:14px 0 8px;font-weight:700;color:#fff}
.msg-content h1{font-size:1.3rem}
.msg-content h2{font-size:1.15rem}
.msg-content h3{font-size:1rem}

/* ═══ TABLES ═══ */
.msg-content table{
  width:100%;border-collapse:collapse;
  margin:14px 0;font-size:.85rem;
  border-radius:var(--r);overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  animation:fadeUp .5s;
}
.msg-content th{
  background:linear-gradient(135deg,var(--primary),var(--primary-hover));
  color:#fff;padding:10px 12px;
  font-weight:700;text-align:right;
}
.msg-content td{
  padding:10px 12px;
  border-bottom:1px solid var(--border);
}
.msg-content tr{transition:background .2s}
.msg-content tr:hover td{background:rgba(77,156,247,.05)}
.msg-content tr:last-child td{border-bottom:none}
.msg-content tr:nth-child(even) td{background:rgba(128,128,128,.03)}

/* ═══ KATEX ═══ */
.katex{font-size:1.05em;direction:ltr;display:inline-block}
.katex-display{
  overflow-x:auto;overflow-y:hidden;
  padding:10px 0;direction:ltr;
}

/* Search results */
.search-box{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;margin:10px 0;
  max-height:280px;overflow-y:auto;
}
.search-box-head{
  display:flex;align-items:center;gap:8px;
  font-size:.78rem;color:var(--text-3);
  font-weight:700;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
}
.search-box-head i{color:var(--primary)}
.search-result{
  padding:10px;border-radius:var(--r-sm);
  margin-bottom:6px;cursor:pointer;
  transition:.2s;border:1px solid transparent;
}
.search-result:hover{
  background:var(--bg-3);border-color:var(--border-2);
}
.search-result a{
  color:var(--primary);font-weight:700;
  font-size:.85rem;text-decoration:none;
  display:block;margin-bottom:4px;
}
.search-result a:hover{text-decoration:underline}
.search-result .url{
  font-size:.7rem;color:var(--success);
  direction:ltr;text-align:left;
  margin-bottom:4px;font-family:monospace;
}
.search-result .snippet{
  font-size:.78rem;color:var(--text-2);line-height:1.7;
}
.search-result .source{
  display:inline-block;
  font-size:.65rem;padding:2px 8px;
  background:var(--bg-4);color:var(--text-3);
  border-radius:var(--r-full);margin-top:4px;
}

<script>
// ═══════════════════════════════════════════════════════════════
// ⚙️  CONFIG
// ═══════════════════════════════════════════════════════════════
const API_BASE = 'https://api.avalai.ir/v1';
const API_KEY = 'aa-RITbplO8bQoxXVBpah52tS5RYZfzxMAoAbBB27gz2ihN2cPd';

const OWNER_EMAIL = 'tahadaneshbayan2@gmail.com';
const SK = 'alphabot_session';
const UK = 'alphabot_users';
const CK = 'alphabot_chats';
const MK = 'alphabot_messages';
const TK = 'alphabot_token_usage';

// ═══════════════════════════════════════════════════════════════
// 🧠 STATE
// ═══════════════════════════════════════════════════════════════
let currentUser = null;
let currentChatId = null;
let chats = [];
let messages = [];
let isStreaming = false;
let currentAbortController = null;
let webSearchEnabled = false;
let pendingFiles = [];
let mediaRecorder = null;
let audioChunks = [];
let recognition = null;
let isRecording = false;
let tokenUsage = JSON.parse(localStorage.getItem(TK) || '{"input":0,"output":0}');

// ═══════════════════════════════════════════════════════════════
// 🛠️  HELPERS
// ═══════════════════════════════════════════════════════════════
function gs(k, d=[]){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function ss(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}

function toast(m, type=''){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = m;
  document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(), 300)}, 2800);
}

function authMsg(m, t='error'){
  const b = document.getElementById('authMsg');
  b.textContent = m;
  b.className = 'auth-msg ' + t;
  b.style.display = 'block';
  setTimeout(()=>b.style.display='none', 5000);
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function scrollToBottom(smooth=false){
  const c = document.getElementById('chatMessages');
  if(c) c.scrollTo({top: c.scrollHeight, behavior: smooth?'smooth':'auto'});
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const s = document.getElementById('screen-'+name);
  if(s) s.classList.add('active');
}

function estimateTokens(text){
  // تخمین: هر ۴ کاراکتر انگلیسی = 1 توکن، هر ۲ کاراکتر فارسی = 1 توکن
  if(!text) return 0;
  const en = (text.match(/[a-zA-Z0-9]/g) || []).length;
  const fa = text.length - en;
  return Math.ceil(en/4 + fa/2);
}

function updateTokenUsage(inp, out){
  tokenUsage.input += inp;
  tokenUsage.output += out;
  localStorage.setItem(TK, JSON.stringify(tokenUsage));
}

function formatTokenUsage(){
  const total = tokenUsage.input + tokenUsage.output;
  // gpt-4o-mini pricing تقریبی: $0.15/1M input, $0.6/1M output
  const cost = (tokenUsage.input * 0.15 + tokenUsage.output * 0.6) / 1000000;
  return `${total.toLocaleString('fa-IR')} توکن (~$${cost.toFixed(4)})`;
}

// ═══════════════════════════════════════════════════════════════
// 🔐 AUTH
// ═══════════════════════════════════════════════════════════════
document.querySelectorAll('.auth-tab').forEach(tab=>{
  tab.addEventListener('click', function(){

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const em = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pw = document.getElementById('loginPass').value;
  if(!em || !pw){authMsg('ایمیل و رمز رو پر کن'); return}
  let u = gs(UK, []);
  if(em === OWNER_EMAIL.toLowerCase()){
    let o = u.find(x=>x.email.toLowerCase() === em);
    if(o){if(o.password !== pw){authMsg('رمز اشتباه');return}}
    else{o = {id:Date.now(), email:em, password:pw, full_name:'مالک AlphaBot', role:'owner', is_admin:true, created_at:new Date().toISOString()};u.push(o)}
    o.role = 'owner'; o.is_admin = true;
    ss(UK, u);
    currentUser = {user_id:o.id, email:o.email, full_name:o.full_name, role:'owner', is_admin:true};

  currentUser = {user_id:x.id, email:x.email, full_name:x.full_name, role:x.role||'user', is_admin:x.is_admin||false};
  ss(SK, currentUser);
  authMsg('✅ ورود موفق','success');
  setTimeout(startApp, 500);
});

document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const n = document.getElementById('regName').value.trim();
  const em = document.getElementById('regEmail').value.trim().toLowerCase();
  const pw = document.getElementById('regPass').value;
  if(!n){authMsg('نام رو بزن');return}
  if(!em || !em.includes('@')){authMsg('ایمیل معتبر');return}

// ═══════════════════════════════════════════════════════════════
// 📝 FORMAT CONTENT
// ═══════════════════════════════════════════════════════════════
function formatContent(text){
  let html = escapeHtml(text || '');

  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
    const langName = (lang || 'text').toLowerCase();
    const cleanCode = code.trim();
    const codeId = 'code_' + Math.random().toString(36).substr(2, 9);
    const dlName = 'code.' + getExtension(langName);
    return `<div class="code-block">
      <div class="code-head">
        <span class="code-lang">${langName}</span>
        <div class="code-actions">
          <button class="code-act" onclick="copyCode(this)" data-code="${escapeHtml(cleanCode).replace(/"/g,'&quot;')}">
            <i class="fas fa-copy"></i> کپی
          </button>
          <button class="code-act" onclick="downloadCode(this)" data-code="${escapeHtml(cleanCode).replace(/"/g,'&quot;')}" data-name="${dlName}">
            <i class="fas fa-download"></i> دانلود
          </button>
        </div>
      </div>
      <div class="code-content" id="${codeId}">${escapeHtml(cleanCode)}</div>
    </div>`;
  });

  // حفظ فرمول‌های ریاضی قبل از پردازش‌های بعدی
  const mathBlocks = [];
  html = html.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr)=>{
    mathBlocks.push({type:'block', expr: expr.trim()});
    return `@@MATH${mathBlocks.length-1}@@`;
  });
  html = html.replace(/(?<!\$)\$([^\$\n]+?)\$(?!\$)/g, (m, expr)=>{
    mathBlocks.push({type:'inline', expr: expr.trim()});
    return `@@MATH${mathBlocks.length-1}@@`;
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headers
  html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');

  // Links
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Tables (markdown)
  html = processTables(html);

  // Lists
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

  // Line breaks
  html = html.replace(/\n/g, '<br>');

  // بازگرداندن فرمول‌ها
  html = html.replace(/@@MATH(\d+)@@/g, (m, i)=>{
    const mb = mathBlocks[+i];
    try{
      return katex.renderToString(mb.expr, {
        displayMode: mb.type==='block',
        throwOnError: false
      });
    }catch(e){
      return mb.expr;
    }
  });

  return html;
}

function processTables(html){
  const lines = html.split('\n');
  const result = [];
  let i = 0;
  while(i < lines.length){
    const line = lines[i].trim();
    // جدول: خط اول | سرستون | سرستون |
    if(line.startsWith('|') && line.endsWith('|')){
      const headerCells = line.split('|').slice(1, -1).map(c=>c.trim());
      // خط دوم باید جداکننده باشه
      if(i + 1 < lines.length){
        const sepLine = lines[i + 1].trim();
        if(/^\|[\s\-:|]+\|$/.test(sepLine)){
          // جدول واقعی
          let table = '<table><thead><tr>';
          headerCells.forEach(h=>{ table += `<th>${h}</th>`; });
          table += '</tr></thead><tbody>';
          i += 2;
          while(i < lines.length){
            const rowLine = lines[i].trim();
            if(!rowLine.startsWith('|') || !rowLine.endsWith('|')) break;
            const cells = rowLine.split('|').slice(1, -1).map(c=>c.trim());
            table += '<tr>';
            cells.forEach(c=>{ table += `<td>${c}</td>`; });
            table += '</tr>';
            i++;
          }
          table += '</tbody></table>';
          result.push(table);
          continue;
        }
      }
    }
    result.push(lines[i]);
    i++;
  }
  return result.join('\n');
}

function getExtension(lang){
  const map = {
    'python': 'py', 'py': 'py', 'javascript': 'js', 'js': 'js',
    'html': 'html', 'css': 'css', 'json': 'json', 'typescript': 'ts',
    'java': 'java', 'cpp': 'cpp', 'c': 'c', 'bash': 'sh', 'shell': 'sh',
    'php': 'php', 'ruby': 'rb', 'go': 'go', 'rust': 'rs', 'sql': 'sql',
    'xml': 'xml', 'yaml': 'yaml', 'markdown': 'md', 'md': 'md'
  };
  return map[lang] || 'txt';
}

}

                          .replace(/\$[^\$]+\$/g, 'فرمول')

async function handleFileSelect(input){
  const files = Array.from(input.files);
  if(!files.length) return;
  for(const file of files){
    if(file.size > 5 * 1024 * 1024){toast('فایل حداکثر ۵MB','error');continue}
    pendingFiles.push(file);
  }
  input.value = '';
  renderAttachPreview();
}

function renderAttachPreview(){
  const preview = document.getElementById('attachPreview');
  if(pendingFiles.length === 0){preview.classList.remove('active'); preview.innerHTML = ''; return}
  preview.classList.add('active');
  preview.innerHTML = pendingFiles.map((f, i)=>`
    <div class="attach-item">
      <i class="fas ${f.type.startsWith('image/')?'fa-image':'fa-file-lines'}"></i>
      <span>${escapeHtml(f.name)}</span>
      <button class="rm" onclick="removePendingFile(${i})"><i class="fas fa-times"></i></button>
    </div>
  `).join('');
}

function removePendingFile(i){
  pendingFiles.splice(i, 1);
  renderAttachPreview();
}

async function processFiles(){
  const results = [];
  for(const file of pendingFiles){
    const result = {name: file.name, type: file.type, content: null, isImage: false};
    if(file.type.startsWith('image/')){
      result.isImage = true;
      result.content = await fileToDataURL(file);
    } else {
      result.content = await fileToText(file);
    }
    results.push(result);
  }
  return results;
}

function fileToDataURL(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function fileToText(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.readAsText(file, 'UTF-8');
  });
}

function toggleVoice(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    toast('مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند','error');
    return;
  }
  if(isRecording){ stopVoice(); return; }
  startVoice();
}

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'fa-IR';
  recognition.continuous = true;
  recognition.interimResults = true;

  let finalText = '';

  recognition.onstart = ()=>{
    isRecording = true;
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('voiceWave').classList.add('active');
  };

  recognition.onresult = (e)=>{
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal){
        finalText += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    document.getElementById('chatInput').value = finalText + interim;
    document.getElementById('chatInput').dispatchEvent(new Event('input'));
  };

  recognition.onerror = (e)=>{
    console.error('Voice error:', e);
    stopVoice();
    if(e.error !== 'aborted') toast('خطا در ضبط صدا','error');
  };

  recognition.onend = ()=>{
    if(isRecording) stopVoice();
  };

  recognition.start();
  toast('🎤 شروع ضبط... دوباره بزن تا متوقف شه');
}

function stopVoice(){
  isRecording = false;
  if(recognition){
    try{ recognition.stop(); }catch(e){}
    recognition = null;
  }
  document.getElementById('voiceBtn').classList.remove('recording');
  document.getElementById('voiceWave').classList.remove('active');
}

function extractSearchQuery(text){
  let q = text;
  const patterns = [
    /توی گوگل بزن\s*[:"]?\s*/gi, /در گوگل بزن\s*[:"]?\s*/gi,
    /گوگل کن\s*[:"]?\s*/gi, /سرچ کن\s*[:"]?\s*/gi,
    /جستجو کن\s*[:"]?\s*/gi, /search\s+(for\s+)?/gi,
    /google\s+/gi, /اینو\s+سرچ\s+کن\s*[:"]?\s*/gi,
    /درباره\s+/gi, /راجع به\s+/gi
  ];
  for(const p of patterns){ q = q.replace(p, ''); }
  return q.trim() || text;
}

function isIranianUrl(url){
  const domains = [
    'irna.ir','mehrnews.com','isna.ir','tasnimnews.com','farsnews.ir',
    'yjc.ir','khabaronline.ir','tabnak.ir','varzesh3.com','zoomit.ir',
    'digiato.com','aparat.com','virgool.io','blog.ir','parsine.com',
    'asriran.com','shabnamnews.com','entekhab.ir','donya-e-eqtesad.com',
    'hamshahrionline.ir','divar.ir','sheypoor.com','bama.ir',
    'cafebazaar.ir','myket.ir','sibapp.com','charkhoneh.com',
    'fa.wikipedia.org'
  ];
  try {
    const host = new URL(url).hostname.toLowerCase();
    if(host.endsWith('.ir')) return true;
    return domains.some(d => host.includes(d));
  } catch { return false }
}

async function searchWeb(query){
  const cleanQuery = extractSearchQuery(query);
  if(!cleanQuery) return [];
  try {
    const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery)}&format=json&no_html=1&skip_disambig=1`;
    const res = await fetch(ddgUrl);
    const data = await res.json();
    const results = [];
    if(data.AbstractText){
      results.push({
        title: data.Heading || cleanQuery,
        url: data.AbstractURL || '',
        snippet: data.AbstractText,
        source: 'DuckDuckGo',
        isIranian: isIranianUrl(data.AbstractURL || '')
      });
    }
    if(data.RelatedTopics){
      for(const t of data.RelatedTopics.slice(0, 6)){
        if(t.Text && t.FirstURL){
          results.push({
            title: t.Text.slice(0, 60),
            url: t.FirstURL,
            snippet: t.Text,
            source: 'DuckDuckGo',
            isIranian: isIranianUrl(t.FirstURL)
          });
        }
      }
    }
    return results.slice(0, 6);
  } catch(e){
    console.error('Search error:', e);
    return [];
  }
}

  chatInput.value = text;
  chatInput.dispatchEvent(new Event('input'));
  sendMessage();
}

// ═══════════════════════════════════════════════════════════════
// 📨 SEND MESSAGE
// ═══════════════════════════════════════════════════════════════
async function sendMessage(){
  const text = chatInput.value.trim();
  if((!text && pendingFiles.length === 0) || !currentChatId || isStreaming) return;
  isStreaming = true;

  // UI: نمایش دکمه Stop
  sendBtn.style.display = 'none';
  stopBtn.classList.add('show');

  const fileResults = pendingFiles.length > 0 ? await processFiles() : [];

  const userContent = text || '(فایل ضمیمه شد)';
  const userMsg = {
    id: Date.now() + '-u',
    chat_id: currentChatId,
    role: 'user',
    content: userContent,
    files: fileResults.map(f=>({name:f.name, type:f.type, isImage:f.isImage, content: f.isImage ? f.content : (f.content||'').slice(0, 5000)})),
    time: Date.now()
  };
  messages.push(userMsg);
  ss(MK, messages);

  const chat = chats.find(c=>c.id === currentChatId);
  if(chat){
    const userMsgs = messages.filter(m=>m.chat_id === currentChatId && m.role === 'user');
    if(userMsgs.length === 1){
      chat.title = userContent.slice(0, 35) + (userContent.length > 35 ? '...' : '');
    }
    chat.updated_at = Date.now();
    ss(CK, chats);
  }

  chatInput.value = '';
  chatInput.style.height = 'auto';
  sendBtn.disabled = true;
  pendingFiles = [];
  renderAttachPreview();

  const inner = document.getElementById('messagesInner');
  const welcome = inner.querySelector('.welcome');
  if(welcome) welcome.remove();

  let userMsgContent = escapeHtml(userContent);
  if(fileResults.length > 0){
    userMsgContent += '<br><br>' + fileResults.map(f=>`
      <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg-3);border-radius:8px;font-size:.78rem;margin:2px;">
        <i class="fas ${f.isImage?'fa-image':'fa-file-lines'}" style="color:var(--primary)"></i> ${escapeHtml(f.name)}
      </span>
    `).join('');
  }

  const avatar = (currentUser.full_name || currentUser.email).charAt(0).toUpperCase();
  inner.insertAdjacentHTML('beforeend', `
    <div class="msg user" data-id="${userMsg.id}">
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-body">
        <div class="msg-name">${escapeHtml(currentUser.full_name || 'شما')}</div>
        <div class="msg-content">${userMsgContent.replace(/\n/g, '<br>')}</div>
      </div>
    </div>
  `);
  scrollToBottom(true);

  let searchResults = [];
  if(webSearchEnabled && text){
    const typingId = 'typing-search-' + Date.now();
    inner.insertAdjacentHTML('beforeend', `
      <div class="msg ai" id="${typingId}">
        <div class="msg-avatar">🤖</div>
        <div class="msg-body">
          <div class="typing">
            <i class="fas fa-globe" style="color:var(--primary)"></i>
            <span>در حال جستجو در اینترنت</span>
            <div class="typing-dots"><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
    `);
    scrollToBottom(true);
    searchResults = await searchWeb(text);
    document.getElementById(typingId)?.remove();
  }

  const typingId = 'typing-' + Date.now();
  inner.insertAdjacentHTML('beforeend', `
    <div class="msg ai" id="${typingId}">
      <div class="msg-avatar">🤖</div>
      <div class="msg-body">
        <div class="typing">
          <span>در حال فکر کردن</span>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
  `);
  scrollToBottom(true);

  const aiMsgId = Date.now() + '-a';
  const aiMsg = {
    id: aiMsgId,
    chat_id: currentChatId,
    role: 'ai',
    content: '',
    searchResults: searchResults,
    time: Date.now()
  };

  try {
    currentAbortController = new AbortController();

    let systemPrompt = `تو AlphaBot هستی، یه دستیار هوش مصنوعی فارسی‌زبان حرفه‌ای.

قوانین مهم:
- فقط فارسی جواب بده
- دوستانه، مفید و دقیق باش
- اگه کد می‌دی توی بلوک کد \`\`\` بذار
- برای فرمول‌های ریاضی از LaTeX استفاده کن: $...$ برای خطی و $$...$$ برای بلوکی
- برای کسر از \\frac{a}{b} استفاده کن
- برای رادیکال از \\sqrt{x} استفاده کن
- برای انتگرال از \\int استفاده کن
- برای نتیجه‌گیری و مقایسه، جدول Markdown بساز
- از ایموجی مناسب استفاده کن ولی زیاد نه
- اگه فایل ضمیمه شد، محتواش رو تحلیل کن
- اگه تصویری ضمیمه شد، متن داخلش رو استخراج کن`;

    if(searchResults.length > 0){
      systemPrompt += `\n\n🔍 نتایج جستجوی وب:\n`;
      searchResults.forEach((r, i)=>{
        systemPrompt += `\n[${i+1}] ${r.title}\n${r.url}\n${r.snippet}\n`;
      });
      systemPrompt += `\nاز این اطلاعات برای پاسخ دقیق استفاده کن و منبع رو ذکر کن.`;
    }

    const apiMessages = [{role:'system', content: systemPrompt}];
    const prevMsgs = messages.filter(m=>m.chat_id === currentChatId && m.id !== aiMsgId).slice(-10);
    prevMsgs.forEach(m => {
      let content = m.content;
      if(m.files && m.files.length > 0){
        const fileText = m.files.filter(f=>!f.isImage && f.content).map(f=>`\n\n[محتوای فایل: ${f.name}]\n${f.content}`).join('');
        if(fileText) content += fileText;
      }
      if(m.role === 'user'){
        apiMessages.push({role:'user', content});
        const images = (m.files || []).filter(f=>f.isImage);
        if(images.length > 0){
          const lastIdx = apiMessages.length - 1;
          apiMessages[lastIdx] = {
            role: 'user',
            content: [
              {type: 'text', text: content},
              ...images.map(img=>({type: 'image_url', image_url: {url: img.content}}))
            ]
          };
        }
      } else {
        apiMessages.push({role:'assistant', content});
      }
    });

    // شمارش توکن ورودی
    const inputTokens = apiMessages.reduce((sum, m) => sum + estimateTokens(typeof m.content === 'string' ? m.content : ''), 0);

    const response = await fetch(`${API_BASE}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: API_MODEL,
        messages: apiMessages,
        temperature: 0.7,
        max_tokens: 2500,
        stream: true
      }),
      signal: currentAbortController.signal
    });

    if(!response.ok){
      const errText = await response.text();
      console.error('API Error:', response.status, errText);
      throw new Error(`HTTP ${response.status}`);
    }

    document.getElementById(typingId)?.remove();

    let aiHtml = '';
    if(searchResults.length > 0){
      aiHtml += `<div class="search-box">
        <div class="search-box-head"><i class="fas fa-search"></i><span>نتایج جستجو (${searchResults.length} مورد)</span></div>
        ${searchResults.map(r=>`
          <div class="search-result" onclick="window.open('${r.url}','_blank')">
            <a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title || 'بدون عنوان')}</a>
            <div class="url">${escapeHtml(r.url)}</div>
            <div class="snippet">${escapeHtml(r.snippet || '')}</div>
            <span class="source ${r.isIranian?'ir':''}">${r.source || (r.isIranian?'سایت ایرانی':'سایت خارجی')}</span>
          </div>
        `).join('')}
      </div>`;
    }

    inner.insertAdjacentHTML('beforeend', `
      <div class="msg ai" id="msg-${aiMsgId}">
        <div class="msg-avatar">🤖</div>
        <div class="msg-body">
          <div class="msg-name">AlphaBot</div>
          ${aiHtml}
          <div class="msg-content" id="content-${aiMsgId}"><span class="stream-cursor"></span></div>
          <div class="msg-actions">
            <button class="msg-act" onclick="copyMsg('${aiMsgId}')"><i class="fas fa-copy"></i></button>
            <button class="msg-act" onclick="speakMsg('${aiMsgId}')"><i class="fas fa-volume-up"></i></button>
            <button class="msg-act" onclick="regenerate()"><i class="fas fa-redo"></i></button>
          </div>
        </div>
      </div>
    `);
    scrollToBottom(true);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    let displayedText = '';
    let displayQueue = '';

    const typeInterval = setInterval(()=>{
      if(displayQueue.length > 0){
        const chunkSize = Math.min(3, displayQueue.length);
        displayedText += displayQueue.slice(0, chunkSize);
        displayQueue = displayQueue.slice(chunkSize);
        const contentEl = document.getElementById('content-' + aiMsgId);
        if(contentEl){
          contentEl.innerHTML = formatContent(displayedText) + '<span class="stream-cursor"></span>';
          scrollToBottom();
        }
      }
    }, 25);

    while(true){
      const {done, value} = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for(const line of lines){
        if(!line.trim() || !line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if(data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if(delta){
            fullText += delta;
            displayQueue += delta;
          }
        } catch(e){}
      }
    }

    await new Promise(resolve=>{
      const check = setInterval(()=>{
        if(displayQueue.length === 0){
          clearInterval(check);
          clearInterval(typeInterval);
          resolve();
        }
      }, 50);
      setTimeout(()=>{clearInterval(check); clearInterval(typeInterval); resolve()}, 15000);
    });

    const contentEl = document.getElementById('content-' + aiMsgId);
    if(contentEl){
      contentEl.innerHTML = formatContent(fullText);
      // رندر فرمول‌ها
      try{
        renderMathInElement(contentEl, {
          delimiters: [
            {left:'$$', right:'$$', display:true},
            {left:'$', right:'$', display:false},
            {left:'\\[', right:'\\]', display:true},
            {left:'\\(', right:'\\)', display:false}
          ],
          throwOnError: false
        });
      }catch(e){}
    }

    if(fullText.trim()){
      aiMsg.content = fullText.trim();
      messages.push(aiMsg);
      ss(MK, messages);

      // آمار توکن
      const outputTokens = estimateTokens(fullText);
      updateTokenUsage(inputTokens, outputTokens);
    } else {
      document.getElementById('msg-' + aiMsgId)?.remove();
      toast('پاسخی دریافت نشد','error');
    }

    if(chat) chat.updated_at = Date.now();
    ss(CK, chats);
    loadChats();

  } catch(err){
    console.error('Stream error:', err);
    document.getElementById(typingId)?.remove();
    document.getElementById('msg-' + aiMsgId)?.remove();

    if(err.name === 'AbortError'){
      toast('⏹ لغو شد');
    } else {
      toast('❌ ' + err.message, 'error');
    }
  }

  isStreaming = false;
  sendBtn.style.display = 'flex';
  stopBtn.classList.remove('show');
  sendBtn.disabled = !chatInput.value.trim();
  chatInput.focus();
}

function stopGeneration(){
  if(currentAbortController){
    currentAbortController.abort();
    currentAbortController = null;
  }
}

// ═══════════════════════════════════════════════════════════════
// 🔄 REGENERATE
// ═══════════════════════════════════════════════════════════════
function regenerate(){
  if(isStreaming) return;
  const chatMsgs = messages.filter(m=>m.chat_id === currentChatId);
  const lastAi = [...chatMsgs].reverse().find(m=>m.role === 'ai');
  const lastUser = [...chatMsgs].reverse().find(m=>m.role === 'user');
  if(!lastAi || !lastUser) return;
  messages = messages.filter(m=>m.id !== lastAi.id);
  ss(MK, messages);
  renderMessages();
  chatInput.value = lastUser.content;
  sendMessage();
}

// ═══════════════════════════════════════════════════════════════
// 📄 DOWNLOAD PDF
// ═══════════════════════════════════════════════════════════════
async function downloadChatPDF(){
  const chatMsgs = messages.filter(m=>m.chat_id === currentChatId);
  if(chatMsgs.length === 0){ toast('گفتگویی برای دانلود نیست','error'); return; }
  toast('📄 در حال ساخت PDF...');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

  // فونت فارسی؟ jsPDF فونت فارسی内置 نداره، پس باید از html2canvas استفاده کنیم
  // راه بهتر: یه div موقت با استایل چاپ بسازیم و ازش عکس بگیریم

  const printDiv = document.createElement('div');
  printDiv.style.cssText = `
    position:fixed;top:-99999px;left:0;
    width:800px;padding:40px;
    background:#ffffff;color:#000000;
    font-family:'Vazirmatn',Tahoma,sans-serif;
    direction:rtl;line-height:1.9;font-size:14px;
  `;

  const chat = chats.find(c=>c.id === currentChatId);
  const title = chat?.title || 'گفتگو';

  printDiv.innerHTML = `
    <div style="text-align:center;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid #4d9cf7;">
      <h1 style="font-size:24px;color:#4d9cf7;margin-bottom:8px;">AlphaBot</h1>
      <div style="font-size:14px;color:#666;">${escapeHtml(title)}</div>
      <div style="font-size:11px;color:#999;margin-top:6px;">${new Date().toLocaleString('fa-IR')}</div>
    </div>
    ${chatMsgs.map(m=>{
      const isUser = m.role === 'user';
      const name = isUser ? (currentUser.full_name || 'شما') : 'AlphaBot';
      const color = isUser ? '#4d9cf7' : '#10a37f';
      const bg = isUser ? '#f0f7ff' : '#f0fdf9';
      const content = formatContent(m.content || '');
      return `
        <div style="margin-bottom:20px;padding:16px;background:${bg};border-radius:12px;border-right:4px solid ${color};">
          <div style="font-weight:700;color:${color};margin-bottom:8px;font-size:13px;">${escapeHtml(name)}</div>
          <div style="color:#000;">${content}</div>
        </div>
      `;
    }).join('')}
    <div style="text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #eee;color:#999;font-size:11px;">
      ساخته شده با AlphaBot - هوش مصنوعی فارسی
    </div>
  `;

  document.body.appendChild(printDiv);

  try {
    const canvas = await html2canvas(printDiv, {
      scale: 2,
      backgroundColor: '#ffffff',
      logging: false,
      useCORS: true
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.9);
    const imgWidth = 210; // A4 width in mm
    const pageHeight = 297; // A4 height in mm
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    let heightLeft = imgHeight;
    let position = 0;

    doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;

    while(heightLeft >= 0){
      position = heightLeft - imgHeight;
      doc.addPage();
      doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    const filename = `AlphaBot-${Date.now()}.pdf`;
    doc.save(filename);
    toast('✅ PDF دانلود شد','success');
  } catch(e){
    console.error('PDF error:', e);
    toast('خطا در ساخت PDF','error');
  } finally {
    printDiv.remove();
  }
}

}

});

  window.visualViewport.addEventListener('resize', ()=>{
    const area = document.querySelector('.input-area');
    if(!area) return;
    const diff = window.innerHeight - window.visualViewport.height;

      area.style.transform = `translateY(-${Math.max(0, diff - 40)}px)`;

      area.style.transform = 'translateY(0)';
    }
  });
}
